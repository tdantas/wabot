<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/icon-180.png">
  <title>WABot — Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="ranking.css">
  <style>
    .premio-rows { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 2px; }
    .premio-row {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 8px; font-size: 0.82rem;
    }
    .premio-row:nth-child(odd) { background: rgba(255,255,255,0.02); }
    .premio-semana { color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 0.75rem; white-space: nowrap; }
    .premio-tipo { color: var(--text); }
    .premio-pts { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
    .premio-resumo { color: var(--text-muted); font-size: 0.75rem; margin-left: 4px; }

    /* com três abas, num ecrã estreito a última passa para a linha de baixo */
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tab {
      font-family: var(--font-body); font-size: 0.78rem; font-weight: 500;
      padding: 9px 14px; border-radius: 8px; min-height: 40px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    }
    .tab.active { background: var(--accent-soft); border-color: var(--border-accent); color: var(--accent); }
    .obs-note { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }

    .tipo-rows { display: flex; flex-direction: column; gap: 8px; }
    .tipo-row { display: grid; grid-template-columns: 120px 1fr auto; align-items: center; gap: 10px; }
    .tipo-label { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; }
    .tipo-track { height: 8px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
    .tipo-fill { height: 100%; background: var(--accent); border-radius: 4px; }
    .tipo-count {
      font-family: var(--font-display); font-weight: 700; font-size: 0.85rem;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .tipo-count small { font-weight: 500; font-size: 0.65rem; color: var(--text-muted); margin-left: 4px; }
    @media (max-width: 560px) { .tipo-row { grid-template-columns: 96px 1fr auto; } }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <div class="list-topbar">
    <span class="topbar-title" id="title">Lista</span>
    <span style="flex:1"></span>
    <button class="share-btn topbar-share" id="topbarShare" style="display:none" onclick="shareRanking()"></button>
  </div>

  <div class="container">
    <div class="period-label" id="periodLabel"></div>

    <div class="filters">
      <div class="filter-presets" id="presets"></div>
      <div class="filter-dates">
        <label>De</label>
        <input type="date" id="startDate">
        <label>Até</label>
        <input type="date" id="endDate">
      </div>
    </div>

    <div class="ui-loading" id="skelList">
      <div style="margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
        <div class="ui-shimmer ui-text" style="width:120px"></div>
        <div class="ui-shimmer" style="height:20px;width:32px;border-radius:6px"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <div style="display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;padding:12px 16px;background:linear-gradient(135deg,rgba(232,168,50,0.08),transparent 70%);border:1px solid rgba(232,168,50,0.1);border-radius:12px">
          <div class="ui-shimmer ui-circle" style="width:24px;height:24px"></div>
          <div><div class="ui-shimmer ui-text" style="width:70%;margin-bottom:6px"></div><div class="ui-shimmer ui-bar" style="width:100%"></div></div>
          <div class="ui-shimmer" style="width:36px;height:18px;border-radius:4px"></div>
        </div>
        <div style="display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;padding:12px 16px;border-radius:12px;background:var(--surface)">
          <div class="ui-shimmer ui-circle" style="width:24px;height:24px"></div>
          <div><div class="ui-shimmer ui-text" style="width:55%;margin-bottom:6px"></div><div class="ui-shimmer ui-bar" style="width:80%"></div></div>
          <div class="ui-shimmer" style="width:30px;height:18px;border-radius:4px"></div>
        </div>
        <div style="display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;padding:12px 16px;border-radius:12px">
          <div class="ui-shimmer ui-circle" style="width:24px;height:24px"></div>
          <div><div class="ui-shimmer ui-text" style="width:65%;margin-bottom:6px"></div><div class="ui-shimmer ui-bar" style="width:60%"></div></div>
          <div class="ui-shimmer" style="width:28px;height:18px;border-radius:4px"></div>
        </div>
        <div style="display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;padding:12px 16px;border-radius:12px;background:var(--surface)">
          <div class="ui-shimmer ui-circle" style="width:24px;height:24px"></div>
          <div><div class="ui-shimmer ui-text" style="width:50%;margin-bottom:6px"></div><div class="ui-shimmer ui-bar" style="width:45%"></div></div>
          <div class="ui-shimmer" style="width:24px;height:18px;border-radius:4px"></div>
        </div>
        <div style="display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;padding:12px 16px;border-radius:12px">
          <div class="ui-shimmer ui-circle" style="width:24px;height:24px"></div>
          <div><div class="ui-shimmer ui-text" style="width:60%;margin-bottom:6px"></div><div class="ui-shimmer ui-bar" style="width:35%"></div></div>
          <div class="ui-shimmer" style="width:22px;height:18px;border-radius:4px"></div>
        </div>
        <div style="display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;padding:12px 16px;border-radius:12px;background:var(--surface)">
          <div class="ui-shimmer ui-circle" style="width:24px;height:24px"></div>
          <div><div class="ui-shimmer ui-text" style="width:45%;margin-bottom:6px"></div><div class="ui-shimmer ui-bar" style="width:25%"></div></div>
          <div class="ui-shimmer" style="width:20px;height:18px;border-radius:4px"></div>
        </div>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="ranking">Ranking</button>
      <button class="tab" data-tab="observadores">Só observam</button>
      <button class="tab" data-tab="premios">Prêmios</button>
    </div>

    <div id="card" class="data-content"></div>
  </div>

  <script src="shared.js"></script>
  <script>
    const DAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb']

    function heatColor(total) {
      if (total < 10) return 'var(--heat-1)'
      if (total < 30) return 'var(--heat-2)'
      if (total < 55) return 'var(--heat-3)'
      if (total < 80) return 'var(--heat-4)'
      if (total < 105) return 'var(--heat-5)'
      if (total < 130) return 'var(--heat-6)'
      if (total < 150) return 'var(--heat-7)'
      return 'var(--heat-8)'
    }

    if (!groupId) location.href = '/'


    // --- presets ---
    const PRESETS = [
      { label: 'Hoje', start: () => todayStr(), end: () => todayStr() },
      { label: '7 dias', start: () => daysAgoStr(6), end: () => todayStr() },
      { label: '15 dias', start: () => daysAgoStr(14), end: () => todayStr() },
      { label: '21 dias', start: () => daysAgoStr(20), end: () => todayStr() },
      { label: '30 dias', start: () => daysAgoStr(29), end: () => todayStr() },
      { label: '2026', start: () => '2026-01-01', end: () => '2026-12-31' },
      { label: '2025', start: () => '2025-01-01', end: () => '2025-12-31' },
    ]

    let activePreset = 'Hoje'
    let customMode = false
    let startDate = todayStr()
    let endDate = todayStr()

    const $start = document.getElementById('startDate')
    const $end = document.getElementById('endDate')
    const $dates = document.querySelector('.filter-dates')

    function formatDatePT(dateStr) {
      const [y, m, d] = dateStr.split('-')
      return `${d}/${m}/${y}`
    }

    function updatePeriodLabel() {
      const $label = document.getElementById('periodLabel')
      if (startDate === endDate) {
        $label.innerHTML = `Período: <span>${formatDatePT(startDate)}</span>`
      } else {
        $label.innerHTML = `Período: <span>${formatDatePT(startDate)}</span> a <span>${formatDatePT(endDate)}</span>`
      }
    }

    function initFilters() {
      const container = document.getElementById('presets')
      container.innerHTML = PRESETS.map(p =>
        `<button class="filter-btn${p.label === activePreset ? ' active' : ''}" data-preset="${p.label}">${p.label}</button>`
      ).join('') + `<button class="filter-btn" data-preset="custom">Custom</button>`

      container.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-preset]')
        if (!btn) return
        if (btn.dataset.preset === 'custom') {
          toggleCustom()
        } else {
          selectPreset(btn.dataset.preset)
        }
      })

      $start.value = startDate
      $end.value = endDate
      $start.addEventListener('change', onDateChange)
      $end.addEventListener('change', onDateChange)
      updatePeriodLabel()
    }

    function selectPreset(label) {
      const p = PRESETS.find(x => x.label === label)
      if (!p) return
      activePreset = label
      customMode = false
      startDate = p.start()
      endDate = p.end()
      $start.value = startDate
      $end.value = endDate
      $dates.classList.remove('visible')
      openDrilldowns.group = null
      openDrilldowns.users.clear()
      updatePresetButtons()
      updatePeriodLabel()
      fetchStats()
    }

    function toggleCustom() {
      customMode = !customMode
      activePreset = customMode ? 'custom' : 'Hoje'
      if (!customMode) {
        selectPreset('Hoje')
        return
      }
      $dates.classList.add('visible')
      updatePresetButtons()
    }

    function onDateChange() {
      startDate = $start.value
      endDate = $end.value
      activePreset = 'custom'
      customMode = true
      openDrilldowns.group = null
      openDrilldowns.users.clear()
      updatePresetButtons()
      updatePeriodLabel()
      fetchStats()
    }

    function updatePresetButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preset === activePreset)
      })
    }

    // --- drilldown state ---
    const openDrilldowns = {
      group: null,
      users: new Map()
    }

    // --- data fetching ---
    function apiUrl(path, extra = '') {
      return `${PAGE_PREFIX}${path}?group=${encodeURIComponent(groupId)}&start=${startDate}&end=${endDate}${extra}`
    }

    async function fetchStats() {
      const fetches = [fetch(apiUrl('/api/stats'), FETCH_OPTS)]

      // refresh open drilldowns in parallel
      if (openDrilldowns.group) {
        fetches.push(fetch(apiUrl('/api/stats/daily'), FETCH_OPTS))
      }
      const userEntries = [...openDrilldowns.users.entries()]
      for (const [sender] of userEntries) {
        // o drilldown de pessoa é por tipo; usar aqui o endpoint antigo
        // sobrepunha as linhas com dados por dia, sem o campo `tipo`
        fetches.push(fetch(apiUrl('/api/stats/user-types', `&sender=${encodeURIComponent(sender)}`), FETCH_OPTS))
      }

      observadores = null // período mudou: os observadores têm de ser relidos
      premios = null
      premiosAbertos.clear()
      const responses = await Promise.all(fetches)
      const data = await responses[0].json()

      let idx = 1
      if (openDrilldowns.group) {
        openDrilldowns.group.rows = await responses[idx++].json()
      }
      for (const [sender, dd] of userEntries) {
        dd.rows = await responses[idx++].json()
      }

      document.getElementById('title').textContent = data.name
      document.title = `WABot — ${data.name}`
      if (abaAtiva === 'observadores') await carregarObservadores()
      if (abaAtiva === 'premios') await carregarPremios()
      render(data)
    }

    async function loadGroupDrilldown() {
      if (openDrilldowns.group) { openDrilldowns.group = null; fetchStats(); return }
      const res = await fetch(apiUrl('/api/stats/daily'), FETCH_OPTS)
      const rows = await res.json()
      openDrilldowns.group = { rows, title: 'Atividade por dia', isNew: true }
      fetchStats()
    }

    async function loadUserDrilldown(sender, name) {
      if (openDrilldowns.users.has(sender)) { openDrilldowns.users.delete(sender); fetchStats(); return }
      const res = await fetch(apiUrl('/api/stats/user-types', `&sender=${encodeURIComponent(sender)}`), FETCH_OPTS)
      const rows = await res.json()
      openDrilldowns.users.set(sender, { rows, title: `${name} — por tipo`, isNew: true, tipos: true })
      fetchStats()
    }

    // rótulo e ícone de cada tipo de atividade
    const TIPOS = {
      text: ['💬', 'Texto'],
      sticker: ['🩹', 'Figurinhas'],
      image: ['🖼️', 'Fotos'],
      video: ['🎬', 'Vídeos'],
      audio: ['🎙️', 'Áudios'],
      document: ['📄', 'Documentos'],
      media: ['📎', 'Média'],
      reaction: ['❤️', 'Reações'],
    }

    function renderTipos(rows, title, closeKey, isNew) {
      const closeAttr = `onclick="event.stopPropagation(); closeDrilldown('${closeKey}')"`
      const animClass = isNew ? ' is-new' : ''
      if (!Array.isArray(rows) || rows.length === 0) {
        return `<div class="drilldown${animClass}">
          <div class="drilldown-header"><span class="drilldown-title">${title}</span>
          <button class="drilldown-close" ${closeAttr}>&times;</button></div>
          <div class="empty">Sem dados</div></div>`
      }
      const total = rows.reduce((a, r) => a + r.total, 0)
      const max = rows[0].total || 1
      return `
        <div class="drilldown${animClass}">
          <div class="drilldown-header">
            <span class="drilldown-title">${title}</span>
            <button class="drilldown-close" ${closeAttr}>&times;</button>
          </div>
          <div class="tipo-rows">
            ${rows.map(r => {
              const [icone, rotulo] = TIPOS[r.tipo] || ['•', r.tipo || 'outro']
              const pct = (r.total / max * 100).toFixed(1)
              const share = total ? Math.round(r.total / total * 100) : 0
              return `
                <div class="tipo-row">
                  <span class="tipo-label">${icone} ${rotulo}</span>
                  <div class="tipo-track"><div class="tipo-fill" style="width:${pct}%"></div></div>
                  <span class="tipo-count">${r.total}<small>${share}%</small></span>
                </div>`
            }).join('')}
          </div>
        </div>`
    }

    function closeDrilldown(key) {
      if (key === 'group') openDrilldowns.group = null
      else openDrilldowns.users.delete(key)
      fetchStats()
    }

    // --- rendering ---
    function groupByDate(rows) {
      const map = new Map()
      for (const r of rows) {
        if (!map.has(r.date)) {
          map.set(r.date, { date: r.date, day_of_week: r.day_of_week, manha: 0, noite: 0, total: 0 })
        }
        const entry = map.get(r.date)
        if (r.period === 'manha') entry.manha += r.total
        else entry.noite += r.total
        entry.total = entry.manha + entry.noite
      }
      return Array.from(map.values())
    }

    function renderDrilldown(rows, title, closeKey, isNew) {
      const closeAttr = `onclick="event.stopPropagation(); closeDrilldown('${closeKey}')"`
      const animClass = isNew ? ' is-new' : ''
      if (!rows || rows.length === 0) {
        return `
          <div class="drilldown${animClass}">
            <div class="drilldown-header">
              <span class="drilldown-title">${title}</span>
              <button class="drilldown-close" ${closeAttr}>&times;</button>
            </div>
            <div class="empty">Sem dados</div>
          </div>`
      }
      const days = groupByDate(rows).slice(-15)
      const max = Math.max(...days.map(d => d.total))
      return `
        <div class="drilldown${animClass}">
          <div class="drilldown-header">
            <span class="drilldown-title">${title}</span>
            <button class="drilldown-close" ${closeAttr}>&times;</button>
          </div>
          <div class="drilldown-legend">
            <span class="legend-item"><span class="legend-dot manha"></span>Manhã (6h-18h)</span>
            <span class="legend-item"><span class="legend-dot noite"></span>Noite (18h-6h)</span>
          </div>
          <div class="drilldown-rows">
            ${days.map(d => {
              const pctM = (d.manha / max * 100).toFixed(1)
              const pctN = (d.noite / max * 100).toFixed(1)
              const color = heatColor(d.total)
              const dt = new Date(d.date)
              const dayLabel = `${DAYS[d.day_of_week]} ${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}`
              return `
                <div class="drill-row">
                  <span class="drill-day">${dayLabel}</span>
                  <span class="drill-bar-track">
                    ${d.manha > 0 ? `<div class="drill-bar-fill manha" style="width:${pctM}%;background:${color}" title="Manhã: ${d.manha}"></div>` : ''}
                    ${d.noite > 0 ? `<div class="drill-bar-fill noite" style="width:${pctN}%;background:${color}" title="Noite: ${d.noite}"></div>` : ''}
                  </span>
                  <span class="drill-count">${d.total}</span>
                </div>`
            }).join('')}
          </div>
        </div>`
    }

    function renderRanking(items, maxCount) {
      if (items.length === 0) {
        return '<div class="empty">Sem dados suficientes</div>'
      }

      let pos = 1
      const ranked = items.map((item, i) => {
        if (i > 0 && item.count < items[i - 1].count) pos = i + 1
        return { ...item, pos }
      })

      return `<div class="rank-list">${ranked.map(item => {
        const clickAttr = item.sender
          ? ` onclick="loadUserDrilldown('${item.sender}', '${esc(item.name).replace(/'/g, "&#39;")}')"` : ''
        let userDrilldown = ''
        if (item.sender && openDrilldowns.users.has(item.sender)) {
          const dd = openDrilldowns.users.get(item.sender)
          userDrilldown = dd.tipos
            ? renderTipos(dd.rows, dd.title, item.sender, dd.isNew)
            : renderDrilldown(dd.rows, dd.title, item.sender, dd.isNew)
          dd.isNew = false
        }
        const barPct = (item.count / maxCount * 100).toFixed(0)
        const posAttr = item.pos <= 3 ? ` data-pos="${item.pos}"` : ''

        return `
          <div class="rank-item clickable"${posAttr}${clickAttr}>
            <span class="rank-pos">${item.pos}</span>
            <div class="rank-main">
              <span class="rank-name">${esc(item.name)}</span>
              <div class="rank-bar-track">
                <div class="rank-bar-fill" style="width:${barPct}%"></div>
              </div>
            </div>
            <span class="rank-count">${item.count}<small>ativ</small></span>
          </div>
          ${userDrilldown}`
      }).join('')}</div>`
    }

    // --- aba "só observam" ---
    let abaAtiva = 'ranking'
    let observadores = null

    document.getElementById('tabs').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-tab]')
      if (!btn || btn.dataset.tab === abaAtiva) return
      abaAtiva = btn.dataset.tab
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === abaAtiva))
      document.getElementById('topbarShare').style.display = abaAtiva === 'ranking' && canShare() ? '' : 'none'
      if (abaAtiva === 'observadores' && !observadores) await carregarObservadores()
      if (abaAtiva === 'premios' && !premios) await carregarPremios()
      render(window._ultimoStats)
    })

    async function carregarObservadores() {
      try {
        const r = await fetch(apiUrl('/api/stats/observers'), FETCH_OPTS)
        observadores = await r.json()
      } catch (err) {
        observadores = []
      }
    }

    function renderObservadores() {
      if (!observadores || observadores.length === 0) {
        return `<div class="section"><div class="section-header"><span class="section-label">Só observam</span></div>
          <div class="empty">Ainda não há presença registada neste período.</div></div>`
      }
      const max = observadores[0].observou || 1

      return `
        <div class="section">
          <div class="section-header">
            <span class="section-label">Só observam</span>
            <span class="section-badge">top ${observadores.length}</span>
          </div>
          <div class="obs-note">Quantas vezes estiveram no grupo sem escrever, reagir ou editar nada.</div>
          <div class="rank-list">${observadores.map((o, i) => {
            const pct = (o.observou / max * 100).toFixed(0)
            const posAttr = i < 3 ? ` data-pos="${i + 1}"` : ''
            return `
              <div class="rank-item"${posAttr}>
                <span class="rank-pos">${i + 1}</span>
                <div class="rank-main">
                  <span class="rank-name">${esc(o.name)}</span>
                  <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
                </div>
                <span class="rank-count">${o.observou}<small>${o.observou === 1 ? 'vez' : 'vezes'}</small></span>
              </div>`
          }).join('')}</div>
        </div>`
    }

    // --- aba "prêmios" ---
    // Os prémios de domingo: BISOU (7 e 15 dias), HAT TRICK (+21) e POKER
    // (+30). Cada janela liderada vale um ponto.
    const PREMIOS = {
      POKER: ['🏆', 'POKER'],
      HAT_TRICK: ['🥇', 'HAT TRICK'],
      BISOU: ['🎖️', 'BISOU'],
    }
    let premios = null
    const premiosAbertos = new Map() // sender → linhas do detalhe

    async function carregarPremios() {
      try {
        const r = await fetch(apiUrl('/api/stats/awards'), FETCH_OPTS)
        premios = await r.json()
        // reabre os detalhes que estavam abertos, já no período novo
        for (const sender of [...premiosAbertos.keys()]) await carregarDetalhePremios(sender, false)
      } catch (err) {
        premios = []
      }
    }

    async function carregarDetalhePremios(sender, redesenhar = true) {
      try {
        const r = await fetch(apiUrl('/api/stats/awards-detail', `&sender=${encodeURIComponent(sender)}`), FETCH_OPTS)
        premiosAbertos.set(sender, await r.json())
      } catch (err) {
        premiosAbertos.set(sender, [])
      }
      if (redesenhar) render(window._ultimoStats)
    }

    async function togglePremios(sender) {
      if (premiosAbertos.has(sender)) {
        premiosAbertos.delete(sender)
        render(window._ultimoStats)
        return
      }
      await carregarDetalhePremios(sender)
    }

    function renderDetalhePremios(sender) {
      const linhas = premiosAbertos.get(sender) || []
      const corpo = linhas.length === 0
        ? '<div class="empty">Sem prêmios neste período</div>'
        : `<div class="premio-rows">${linhas.map(l => {
            const [icone, rotulo] = PREMIOS[l.type] || ['•', l.type]
            return `
              <div class="premio-row">
                <span class="premio-semana">${l.semana_inicio} – ${l.semana_fim}</span>
                <span class="premio-tipo">${icone} ${rotulo}</span>
                <span class="premio-pts">+${l.pontos}</span>
              </div>`
          }).join('')}</div>`
      return `
        <div class="drilldown is-new">
          <div class="drilldown-header">
            <span class="drilldown-title">Semanas ganhas</span>
            <button class="drilldown-close" onclick="event.stopPropagation(); togglePremios('${sender}')">&times;</button>
          </div>
          ${corpo}
        </div>`
    }

    function renderPremios() {
      if (!premios || premios.length === 0) {
        return `<div class="section"><div class="section-header"><span class="section-label">Prêmios</span></div>
          <div class="empty">Nenhum prêmio neste período.</div></div>`
      }
      const max = premios[0].pontos || 1
      return `
        <div class="section">
          <div class="section-header">
            <span class="section-label">Prêmios</span>
            <span class="section-badge">${premios.reduce((a, p) => a + p.premios, 0)} no total</span>
          </div>
          <div class="obs-note">Pontos dos prêmios de domingo: BISOU 2, HAT TRICK 3, POKER 4. Clica em alguém para ver as semanas.</div>
          <div class="rank-list">${premios.map((p, i) => {
            const pct = (p.pontos / max * 100).toFixed(0)
            const posAttr = i < 3 ? ` data-pos="${i + 1}"` : ''
            const resumo = Object.entries(p.tipos)
              .map(([t, n]) => `${(PREMIOS[t] || ['•'])[0]}${n > 1 ? ' ' + n : ''}`).join(' ')
            return `
              <div class="rank-item clickable"${posAttr} onclick="togglePremios('${p.sender}')">
                <span class="rank-pos">${i + 1}</span>
                <div class="rank-main">
                  <span class="rank-name">${esc(p.name)} <small class="premio-resumo">${resumo}</small></span>
                  <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
                </div>
                <span class="rank-count">${p.pontos}<small>pts</small></span>
              </div>
              ${premiosAbertos.has(p.sender) ? renderDetalhePremios(p.sender) : ''}`
          }).join('')}</div>
        </div>`
    }

    function render(data) {
      window._ultimoStats = data
      if (abaAtiva === 'observadores') {
        document.getElementById('card').innerHTML = renderObservadores()
        return
      }
      if (abaAtiva === 'premios') {
        document.getElementById('card').innerHTML = renderPremios()
        return
      }
      const card = document.getElementById('card')
      const maxCount = data.rows[0]?.count || 1
      const total = data.rows.reduce((s, r) => s + r.count, 0)

      const groupDrilldownHtml = openDrilldowns.group
        ? renderDrilldown(openDrilldowns.group.rows, openDrilldowns.group.title, 'group', openDrilldowns.group.isNew)
        : ''
      if (openDrilldowns.group) openDrilldowns.group.isNew = false

      const showDailyLink = startDate !== endDate

      // store for sharing
      window._lastRanking = { name: data.name, rows: data.rows, start: startDate, end: endDate }

      // show topbar share button
      if (canShare()) {
        const btn = document.getElementById('topbarShare')
        if (btn && !btn.innerHTML) btn.innerHTML = _shareIcon + ' Partilhar'
        if (btn) btn.style.display = ''
      }

      card.innerHTML = `
        <div class="section">
          <div class="section-header">
            <span class="section-label">Ranking</span>
            ${total > 0 ? `<span class="section-badge">${total} total</span>` : ''}
            ${showDailyLink ? `<span class="section-expand" onclick="loadGroupDrilldown()">${openDrilldowns.group ? 'Fechar' : 'Ver por dia'} &#9656;</span>` : ''}
          </div>
          ${groupDrilldownHtml}
          ${renderRanking(data.rows, maxCount)}
        </div>
      `
    }

    function shareRanking() {
      const r = window._lastRanking
      if (!r) return
      const medals = ['\u{1F947}', '\u{1F948}', '\u{1F949}']
      const period = r.start === r.end ? formatDatePT(r.start) : `${formatDatePT(r.start)} a ${formatDatePT(r.end)}`
      const time = new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })
      const lines = r.rows.slice(0, 3).map((row, i) => `${medals[i]} *${row.name}* ${row.count} ativ`)
      const text = `*Usage Report ${r.name}*\n${period} às ${time}\n\n${lines.join('\n')}\n\nEnvia *!live* no grupo para ver o relatório completo`
      shareResults(`Usage Report ${r.name}`, text)
    }

    // load immediately
    initFilters()
    fetchStats().then(() => {
      requestAnimationFrame(() => document.body.classList.add('loaded'))
    })
    setInterval(fetchStats, 5000)
    initPullToRefresh(fetchStats)
  </script>
</body>
</html>
