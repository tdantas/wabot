<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/icon-180.png">
  <title>WABot — Gráficos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="ranking.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .bg-glow--1 { width: 600px; height: 600px; top: -200px; right: -100px; background: var(--accent); opacity: 0.06; }
    .bg-glow--2 { width: 500px; height: 500px; bottom: -150px; left: -150px; background: #4a2d7a; opacity: 0.08; }

    .chart-filters {
      position: relative; z-index: 1;
      padding: 16px 24px 0;
    }
    @media (min-width: 701px) {
      body.has-bottom-nav .chart-filters { margin-left: 200px; }
    }
    @media (max-width: 700px) {
      .chart-filters { padding: 12px 12px 0; }
    }

    /* --- top 5 panel --- */
    .top5-panel {
      grid-column: span 3;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 24px;
    }
    .top5-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    }
    .top5-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary);
    }
    .top5-hint {
      font-size: 0.65rem; color: var(--text); opacity: 0.6; margin-left: auto; font-weight: 400;
    }
    .top5-list { display: flex; gap: 12px; }

    .top5-card {
      flex: 1; position: relative; cursor: pointer;
      background: rgba(255,255,255,0.02); border: 2px solid transparent;
      border-radius: 12px; padding: 14px 16px; transition: all 0.25s;
      overflow: hidden;
    }
    .top5-card:hover { background: rgba(255,255,255,0.04); }
    .top5-card.active { border-color: var(--border-accent); background: rgba(255,255,255,0.04); }
    .top5-card.dimmed { opacity: 0.3; }
    .top5-card.dimmed:hover { opacity: 0.6; }

    .top5-rank {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .top5-pos {
      font-family: var(--font-display); font-weight: 800; font-size: 1.4rem;
      line-height: 1; min-width: 22px;
    }
    .top5-name {
      font-weight: 600; font-size: 0.88rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .top5-count {
      font-family: var(--font-display); font-weight: 700;
      font-size: 1.1rem; margin-bottom: 6px;
    }
    .top5-count small { font-weight: 400; font-size: 0.65rem; color: var(--text-muted); margin-left: 2px; }
    .top5-bar {
      height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden;
    }
    .top5-bar-fill {
      height: 100%; border-radius: 2px; transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (max-width: 1100px) {
      .top5-panel { grid-column: span 2; }
      .top5-list { flex-wrap: wrap; }
      .top5-card { flex: 1 1 45%; }
    }
    @media (max-width: 700px) {
      .top5-panel { grid-column: span 1; }
      .top5-list { flex-direction: column; }
      .top5-card { flex: 1 1 100%; }
    }

    /* --- dashboard grid --- */
    .dashboard {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto;
      gap: 16px;
      padding: 20px 24px 60px;
    }

    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; display: flex; flex-direction: column;
    }

    .chart-card.span-2 { grid-column: span 2; }
    .chart-card.span-3 { grid-column: span 3; }

    .chart-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    }
    .chart-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary);
    }
    .chart-toggle { display: flex; gap: 4px; }
    .toggle-btn {
      font-family: var(--font-body); font-size: 0.7rem; font-weight: 500;
      padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
      min-height: 36px; display: inline-flex; align-items: center;
    }
    .toggle-btn.active { background: var(--accent-soft); border-color: var(--border-accent); color: var(--accent); }

    .chart-wrap { position: relative; flex: 1; min-height: 240px; }


    @media (max-width: 1100px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); }
      .chart-card.span-3 { grid-column: span 2; }

    }
    @media (max-width: 700px) {
      .dashboard { grid-template-columns: 1fr; padding: 16px 12px 60px; }
      .chart-card.span-2, .chart-card.span-3 { grid-column: span 1; }

      .user-pills { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <div class="topbar">
    <span class="topbar-title" id="title">Gráficos</span>
  </div>

  <div class="chart-filters">
    <div class="filter-presets" id="controls">
      <button class="filter-btn active" data-range="7">7 dias</button>
      <button class="filter-btn" data-range="15">15 dias</button>
      <button class="filter-btn" data-range="30">30 dias</button>
      <button class="filter-btn" data-preset="custom">Custom</button>
    </div>
    <div class="filter-dates" id="chartDates">
      <label>De</label><input type="date" id="startDate">
      <label>Até</label><input type="date" id="endDate">
    </div>
  </div>

  <div class="dashboard ui-loading" id="skelCharts" style="pointer-events:none">
    <div class="ui-card" style="grid-column:span 3;padding:20px 24px">
      <div class="ui-shimmer ui-text" style="width:140px;margin-bottom:16px"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="ui-shimmer" style="height:48px;width:120px;border-radius:12px"></div>
        <div class="ui-shimmer" style="height:48px;width:100px;border-radius:12px"></div>
        <div class="ui-shimmer" style="height:48px;width:130px;border-radius:12px"></div>
        <div class="ui-shimmer" style="height:48px;width:90px;border-radius:12px"></div>
        <div class="ui-shimmer" style="height:48px;width:110px;border-radius:12px"></div>
      </div>
    </div>
    <div class="ui-card" style="grid-column:span 2;padding:18px;min-height:300px">
      <div class="ui-shimmer ui-text" style="width:180px;margin-bottom:14px"></div>
      <div class="ui-shimmer" style="height:100%;min-height:240px;border-radius:8px"></div>
    </div>
    <div class="ui-card" style="padding:18px;min-height:300px">
      <div class="ui-shimmer ui-text" style="width:100px;margin-bottom:14px"></div>
      <div class="ui-shimmer" style="height:100%;min-height:240px;border-radius:8px"></div>
    </div>
    <div class="ui-card" style="padding:18px;min-height:260px">
      <div class="ui-shimmer ui-text" style="width:130px;margin-bottom:14px"></div>
      <div class="ui-shimmer" style="height:100%;min-height:200px;border-radius:8px"></div>
    </div>
    <div class="ui-card" style="padding:18px;min-height:260px">
      <div class="ui-shimmer ui-text" style="width:110px;margin-bottom:14px"></div>
      <div class="ui-shimmer" style="height:100%;min-height:200px;border-radius:8px"></div>
    </div>
    <div class="ui-card" style="padding:18px;min-height:260px">
      <div class="ui-shimmer ui-text" style="width:150px;margin-bottom:14px"></div>
      <div class="ui-shimmer" style="height:100%;min-height:200px;border-radius:8px"></div>
    </div>
  </div>

  <div class="dashboard data-content">
    <!-- top 5 panel -->
    <div class="top5-panel">
      <div class="top5-header">
        <span class="top5-title">Top 5 mais ativos</span>
        <span class="top5-hint">Clica para filtrar os gráficos</span>
      </div>
      <div class="top5-list" id="userPills"></div>
    </div>

    <!-- row 1: activity + trend -->
    <div class="chart-card span-2">
      <div class="chart-header">
        <span class="chart-title">Top 5 — Atividade diária</span>
        <div class="chart-toggle" data-target="activity">
          <button class="toggle-btn active" data-type="line">Linha</button>
          <button class="toggle-btn" data-type="bar">Barra</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chartActivity"></canvas></div>
    </div>

    <div class="chart-card">
      <div class="chart-header"><span class="chart-title">Padrão semanal</span></div>
      <div class="chart-wrap"><canvas id="chartRadar"></canvas></div>
    </div>

    <!-- row 2: weekday + period + period×weekday -->
    <div class="chart-card">
      <div class="chart-header"><span class="chart-title">Por dia da semana</span></div>
      <div class="chart-wrap"><canvas id="chartWeekday"></canvas></div>
    </div>

    <div class="chart-card">
      <div class="chart-header"><span class="chart-title">Manhã vs Noite</span></div>
      <div class="chart-wrap"><canvas id="chartPeriod"></canvas></div>
    </div>

    <div class="chart-card">
      <div class="chart-header"><span class="chart-title">Período × Dia da semana</span></div>
      <div class="chart-wrap"><canvas id="chartPeriodWeekday"></canvas></div>
    </div>

    <!-- row 3: trend full width -->
    <div class="chart-card span-3">
      <div class="chart-header"><span class="chart-title">Tendência do grupo</span></div>
      <div class="chart-wrap"><canvas id="chartTrend"></canvas></div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const DAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb']
    const COLORS = [
      { line: '#e8a832', bg: 'rgba(232,168,50,0.15)' },
      { line: '#4ade80', bg: 'rgba(74,222,128,0.15)' },
      { line: '#60a5fa', bg: 'rgba(96,165,250,0.15)' },
      { line: '#f472b6', bg: 'rgba(244,114,182,0.15)' },
      { line: '#a78bfa', bg: 'rgba(167,139,250,0.15)' },
    ]
    const MANHA_COLOR = '#f0a030'
    const NOITE_COLOR = '#7c6cfa'

    if (!groupId) location.href = '/'


    // --- helpers ---
    function apiUrl(path, extra = '') {
      return `${PAGE_PREFIX}${path}?group=${encodeURIComponent(groupId)}&start=${startDate}&end=${endDate}${extra}`
    }
    function sendersParam() {
      if (activeUsers.size === 0 || activeUsers.size === allUsers.length) return ''
      return '&senders=' + [...activeUsers].map(encodeURIComponent).join(',')
    }
    function buildDateRange() {
      const out = [], d = new Date(startDate + 'T12:00:00'), dEnd = new Date(endDate + 'T12:00:00')
      while (d <= dEnd) { out.push(localDate(d)); d.setDate(d.getDate() + 1) }
      return out
    }
    function dateLabel(date) {
      const dt = new Date(date + 'T12:00:00')
      return `${DAYS[dt.getDay()]} ${date.slice(8)}/${date.slice(5,7)}`
    }

    let startDate = daysAgoStr(6), endDate = todayStr(), activityType = 'line'

    const $start = document.getElementById('startDate')
    const $end = document.getElementById('endDate')
    $start.value = startDate; $end.value = endDate

    // --- controls ---
    const $chartDates = document.getElementById('chartDates')

    document.getElementById('controls').addEventListener('click', (e) => {
      const customBtn = e.target.closest('[data-preset="custom"]')
      if (customBtn) {
        const isVisible = $chartDates.classList.toggle('visible')
        updateChartButtons(isVisible ? 'custom' : '7')
        return
      }
      const btn = e.target.closest('[data-range]')
      if (!btn) return
      startDate = daysAgoStr(parseInt(btn.dataset.range) - 1); endDate = todayStr()
      $start.value = startDate; $end.value = endDate
      $chartDates.classList.remove('visible')
      updateChartButtons(btn.dataset.range)
      loadAll()
    })

    $start.addEventListener('change', () => { startDate = $start.value; updateChartButtons('custom'); loadAll() })
    $end.addEventListener('change', () => { endDate = $end.value; updateChartButtons('custom'); loadAll() })

    function updateChartButtons(active) {
      document.querySelectorAll('#controls .filter-btn').forEach(b => {
        const isRange = b.dataset.range === active
        const isCustom = b.dataset.preset === 'custom' && active === 'custom'
        b.classList.toggle('active', isRange || isCustom)
      })
    }

    document.querySelector('[data-target="activity"]').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-type]')
      if (!btn) return
      activityType = btn.dataset.type
      e.currentTarget.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      renderActivityChart()
    })

    // --- Chart.js defaults ---
    Chart.defaults.color = '#a09d95'
    Chart.defaults.borderColor = 'rgba(255,255,255,0.06)'
    Chart.defaults.font.family = "'Outfit', sans-serif"

    const chartInstances = {}
    function makeChart(id, config) {
      if (chartInstances[id]) chartInstances[id].destroy()
      chartInstances[id] = new Chart(document.getElementById(id), config)
    }

    const sharedTooltip = {
      backgroundColor: 'rgba(10,11,15,0.95)', borderColor: 'rgba(255,255,255,0.1)',
      borderWidth: 1, titleFont: { weight: 700 }, bodyFont: { size: 13 },
      padding: 12, cornerRadius: 10,
    }

    // --- avg line plugin ---
    const avgLinePlugin = {
      id: 'avgLine',
      afterDraw(chart) {
        if (!chart.config.options.plugins?.avgLine) return
        const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart
        const visible = chart.data.datasets
          .map((ds, i) => chart.isDatasetVisible(i) ? ds.data : null).filter(Boolean)
        if (visible.length === 0) return
        const vals = visible.flat().filter(v => v > 0)
        if (vals.length === 0) return
        const avg = vals.reduce((a, b) => a + b, 0) / vals.length
        const yPos = y.getPixelForValue(avg)
        if (yPos < top || yPos > bottom) return
        ctx.save()
        ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(232,168,50,0.5)'; ctx.lineWidth = 1.5
        ctx.beginPath(); ctx.moveTo(left, yPos); ctx.lineTo(right, yPos); ctx.stroke()
        ctx.setLineDash([]); ctx.fillStyle = 'rgba(232,168,50,0.8)'
        ctx.font = "600 11px 'Outfit', sans-serif"; ctx.textAlign = 'right'
        ctx.fillText(`média: ${avg.toFixed(1)}`, right - 4, yPos - 6)
        ctx.restore()
      }
    }
    Chart.register(avgLinePlugin)

    // =====================
    // USER SELECTION STATE
    // =====================
    let allUsers = []       // [{ sender, name, color, total }]
    let activeUsers = new Set() // senders that are visible


    function renderPills() {
      const container = document.getElementById('userPills')
      const maxTotal = allUsers[0]?.total || 1

      container.innerHTML = allUsers.map((u, i) => {
        const isActive = activeUsers.has(u.sender)
        const allActive = activeUsers.size === allUsers.length
        const cls = allActive ? 'active' : (isActive ? 'active' : 'dimmed')
        const pos = i + 1
        const pct = (u.total / maxTotal * 100).toFixed(0)
        const posLabel = pos

        return `<div class="top5-card ${cls}" data-sender="${u.sender}">
          <div class="top5-rank">
            <span class="top5-pos" style="color:${u.color}">${posLabel}</span>
            <span class="top5-name">${esc(u.name)}</span>
          </div>
          <div class="top5-count">${u.total}<small>ativ</small></div>
          <div class="top5-bar">
            <div class="top5-bar-fill" style="width:${pct}%;background:${u.color}"></div>
          </div>
        </div>`
      }).join('')

      container.onclick = (e) => {
        const card = e.target.closest('[data-sender]')
        if (!card) return
        const sender = card.dataset.sender
        const allActive = activeUsers.size === allUsers.length

        if (allActive) {
          activeUsers = new Set([sender])
        } else if (activeUsers.has(sender) && activeUsers.size === 1) {
          activeUsers = new Set(allUsers.map(u => u.sender))
        } else if (activeUsers.has(sender)) {
          activeUsers.delete(sender)
        } else {
          activeUsers.add(sender)
        }
        renderPills()
        syncAllCharts()
      }
    }

    async function syncAllCharts() {
      // activity chart — toggle visibility
      const act = chartInstances['chartActivity']
      if (act) {
        act.data.datasets.forEach((ds, i) => {
          if (i < allUsers.length) act.setDatasetVisibility(i, activeUsers.has(allUsers[i].sender))
        })
        act.update()
      }
      // radar chart — toggle visibility
      const radar = chartInstances['chartRadar']
      if (radar) {
        radar.data.datasets.forEach((ds, i) => {
          if (i < allUsers.length) radar.setDatasetVisibility(i, activeUsers.has(allUsers[i].sender))
        })
        radar.update()
      }

      // reload filtered charts
      const sp = sendersParam()
      try {
        const [rWeekday, rPeriod, rPeriodWd, rTrend] = await Promise.all([
          fetch(apiUrl('/api/stats/by-weekday', sp), FETCH_OPTS),
          fetch(apiUrl('/api/stats/by-period', sp), FETCH_OPTS),
          fetch(apiUrl('/api/stats/period-weekday', sp), FETCH_OPTS),
          fetch(apiUrl('/api/stats/trend', sp), FETCH_OPTS),
        ])

        cachedWeekday = await rWeekday.json()
        cachedPeriod = await rPeriod.json()
        cachedPeriodWeekday = await rPeriodWd.json()
        cachedTrend = await rTrend.json()

        renderWeekdayChart()
        renderPeriodChart()
        renderPeriodWeekdayChart()
        renderTrendChart()
      } catch (err) {
        console.error('Failed to sync charts', err)
      }
    }

    // =====================
    // CACHED DATA
    // =====================
    let cachedActivity = null, cachedTrend = null, cachedWeekday = null
    let cachedPeriod = null, cachedPeriodWeekday = null, cachedRadar = null

    // =====================
    // 1. ACTIVITY (line/bar)
    // =====================
    function renderActivityChart() {
      if (!cachedActivity) return
      const allDates = buildDateRange()
      const labels = allDates.map(dateLabel)
      const datasets = cachedActivity.users.map((user, i) => {
        const c = COLORS[i % COLORS.length]
        const dayMap = new Map(user.days.map(d => [d.date.slice(0, 10), d.total]))
        const values = allDates.map(date => dayMap.get(date) || 0)
        return activityType === 'line' ? {
          label: user.name, data: values,
          borderColor: c.line, backgroundColor: c.bg,
          borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 5,
          pointBackgroundColor: c.line, tension: 0.3, fill: true,
        } : {
          label: user.name, data: values,
          backgroundColor: c.line + 'cc', borderColor: c.line,
          borderWidth: 1, borderRadius: 4,
        }
      })
      makeChart('chartActivity', {
        type: activityType, data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            avgLine: true,
            legend: { display: false },
            tooltip: { ...sharedTooltip, callbacks: { label: (ctx) => `  ${ctx.dataset.label}: ${ctx.parsed.y}` } },
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { precision: 0, font: { size: 10 } } },
          },
        },
      })
      syncAllCharts()
    }

    // =====================
    // 2. TREND
    // =====================
    function renderTrendChart() {
      if (!cachedTrend) return
      const allDates = buildDateRange()
      const labels = allDates.map(dateLabel)
      const dayMap = new Map(cachedTrend.map(r => [r.date.slice(0, 10), r.total]))
      const values = allDates.map(d => dayMap.get(d) || 0)
      makeChart('chartTrend', {
        type: 'line', data: { labels, datasets: [{
          label: 'Total', data: values,
          borderColor: '#4ade80', backgroundColor: 'rgba(74,222,128,0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#4ade80', tension: 0.3, fill: true,
        }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { avgLine: true, legend: { display: false }, tooltip: { ...sharedTooltip, callbacks: { label: (ctx) => `  ${ctx.parsed.y} atividade` } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { precision: 0, font: { size: 10 } } },
          },
        },
      })
    }

    // =====================
    // 3. WEEKDAY
    // =====================
    function renderWeekdayChart() {
      if (!cachedWeekday) return
      const values = Array(7).fill(0)
      cachedWeekday.forEach(r => { values[r.day_of_week] = r.total })
      const max = Math.max(...values)
      const colors = values.map(v => {
        const r = max > 0 ? v / max : 0
        if (r < 0.25) return '#3d6b4f'
        if (r < 0.5) return '#8ebb30'
        if (r < 0.75) return '#e87a20'
        return '#d43a3a'
      })
      makeChart('chartWeekday', {
        type: 'bar', data: { labels: DAYS, datasets: [{ data: values, backgroundColor: colors, borderRadius: 6, borderSkipped: false }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { ...sharedTooltip, callbacks: { label: (ctx) => `  ${ctx.parsed.y} ativ` } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11, weight: 600 } } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { precision: 0, font: { size: 10 } } },
          },
        },
      })
    }

    // =====================
    // 4. PERIOD DOUGHNUT
    // =====================
    function renderPeriodChart() {
      if (!cachedPeriod) return
      const m = cachedPeriod.find(r => r.period === 'manha')?.total || 0
      const n = cachedPeriod.find(r => r.period === 'noite')?.total || 0
      const t = m + n
      makeChart('chartPeriod', {
        type: 'doughnut',
        data: { labels: ['Manhã (6h-18h)', 'Noite (18h-6h)'], datasets: [{
          data: [m, n], backgroundColor: [MANHA_COLOR + 'cc', NOITE_COLOR + 'cc'],
          borderColor: [MANHA_COLOR, NOITE_COLOR], borderWidth: 2, hoverOffset: 6,
        }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '62%',
          plugins: {
            legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, pointStyle: 'circle', font: { size: 11 } } },
            tooltip: { ...sharedTooltip, callbacks: { label: (ctx) => { const p = t > 0 ? (ctx.parsed/t*100).toFixed(1) : 0; return `  ${ctx.label}: ${ctx.parsed} (${p}%)` } } },
          },
        },
        plugins: [{
          id: 'center',
          afterDraw(chart) {
            const { ctx, chartArea: { left, right, top, bottom } } = chart
            const cx = (left+right)/2, cy = (top+bottom)/2
            ctx.save(); ctx.fillStyle = '#e8e6e1'
            ctx.font = "800 22px 'Bricolage Grotesque',serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
            ctx.fillText(t, cx, cy-6)
            ctx.fillStyle = '#5a574f'; ctx.font = "500 10px 'Outfit',sans-serif"; ctx.fillText('total', cx, cy+12)
            ctx.restore()
          }
        }],
      })
    }

    // =====================
    // 5. PERIOD × WEEKDAY
    // =====================
    function renderPeriodWeekdayChart() {
      if (!cachedPeriodWeekday) return
      const manha = Array(7).fill(0), noite = Array(7).fill(0)
      cachedPeriodWeekday.forEach(r => {
        if (r.period === 'manha') manha[r.day_of_week] = r.total
        else noite[r.day_of_week] = r.total
      })
      makeChart('chartPeriodWeekday', {
        type: 'bar', data: { labels: DAYS, datasets: [
          { label: 'Manhã', data: manha, backgroundColor: MANHA_COLOR+'cc', borderColor: MANHA_COLOR, borderWidth: 1, borderRadius: 4 },
          { label: 'Noite', data: noite, backgroundColor: NOITE_COLOR+'cc', borderColor: NOITE_COLOR, borderWidth: 1, borderRadius: 4 },
        ] },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11, weight: 600 } } },
            y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { precision: 0, font: { size: 10 } } },
          },
          plugins: {
            legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, pointStyle: 'circle', font: { size: 11 } } },
            tooltip: { ...sharedTooltip, callbacks: { label: (ctx) => `  ${ctx.dataset.label}: ${ctx.parsed.y}` } },
          },
        },
      })
    }

    // =====================
    // 6. RADAR
    // =====================
    function renderRadarChart() {
      if (!cachedRadar) return
      const datasets = cachedRadar.map((user, i) => {
        const c = COLORS[i % COLORS.length]
        return {
          label: user.name, data: user.weekdays,
          borderColor: c.line, backgroundColor: c.bg,
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: c.line,
        }
      })
      makeChart('chartRadar', {
        type: 'radar', data: { labels: DAYS, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { r: {
            beginAtZero: true, grid: { color: 'rgba(255,255,255,0.06)' },
            angleLines: { color: 'rgba(255,255,255,0.06)' },
            pointLabels: { font: { size: 11, weight: 600 }, color: '#a09d95' }, ticks: { display: false },
          } },
          plugins: {
            legend: { display: false },
            tooltip: { ...sharedTooltip, callbacks: { label: (ctx) => `  ${ctx.dataset.label}: ${ctx.parsed.r} ativ` } },
          },
        },
      })
      syncAllCharts()
    }

    // =====================
    // LOAD ALL
    // =====================
    async function loadAll() {
      let rActivity, rTrend, rWeekday, rPeriod, rPeriodWd, rRadar
      try {
        [rActivity, rTrend, rWeekday, rPeriod, rPeriodWd, rRadar] = await Promise.all([
          fetch(apiUrl('/api/stats/top-users-daily'), FETCH_OPTS),
          fetch(apiUrl('/api/stats/trend'), FETCH_OPTS),
          fetch(apiUrl('/api/stats/by-weekday'), FETCH_OPTS),
          fetch(apiUrl('/api/stats/by-period'), FETCH_OPTS),
          fetch(apiUrl('/api/stats/period-weekday'), FETCH_OPTS),
          fetch(apiUrl('/api/stats/users-weekday'), FETCH_OPTS),
        ])
      } catch (err) {
        document.getElementById('userPills').innerHTML = '<div style="color:var(--text-muted);padding:12px;text-align:center;width:100%">Erro ao carregar dados. Tente novamente.</div>'
        return
      }

      cachedActivity = await rActivity.json()
      cachedTrend = await rTrend.json()
      cachedWeekday = await rWeekday.json()
      cachedPeriod = await rPeriod.json()
      cachedPeriodWeekday = await rPeriodWd.json()
      cachedRadar = await rRadar.json()

      document.getElementById('title').textContent = cachedActivity.name
      document.title = `WABot — ${cachedActivity.name} — Analytics`

      // build user list
      allUsers = cachedActivity.users.map((u, i) => ({
        sender: u.sender, name: u.name, total: u.total, color: COLORS[i % COLORS.length].line,
      }))
      activeUsers = new Set(allUsers.map(u => u.sender))
      renderPills()


      renderActivityChart()
      renderTrendChart()
      renderWeekdayChart()
      renderPeriodChart()
      renderPeriodWeekdayChart()
      renderRadarChart()

      requestAnimationFrame(() => document.body.classList.add('loaded'))
    }

    loadAll()
    initPullToRefresh(loadAll)
  </script>
</body>
</html>
