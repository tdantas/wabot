<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0b0f"/>
      <stop offset="100%" style="stop-color:#141520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a832"/>
      <stop offset="100%" style="stop-color:#d4922a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="15%" r="40%">
      <stop offset="0%" style="stop-color:#e8a832;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#e8a832;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="35%">
      <stop offset="0%" style="stop-color:#5b3a8c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#5b3a8c;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- brand mark square -->
  <rect x="80" y="180" width="88" height="88" rx="22" fill="url(#accent)"/>
  <!-- W shape inside brand mark (paths not text) -->
  <path d="M101 205 L112 253 L120 228 L128 253 L139 205" fill="none" stroke="#0a0b0f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 205 L148 253 L156 228 L156 228" fill="none" stroke="#0a0b0f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- WABot text -->
  <text x="190" y="250" font-family="Liberation Sans, Arial, sans-serif" font-weight="900" font-size="76" fill="#e8e6e1" letter-spacing="-4">WA</text>
  <text x="348" y="250" font-family="Liberation Sans, Arial, sans-serif" font-weight="900" font-size="76" fill="#e8a832" letter-spacing="-4">Bot</text>

  <!-- tagline -->
  <text x="85" y="320" font-family="Liberation Sans, Arial, sans-serif" font-weight="400" font-size="30" fill="#a09d95">Agente inteligente para WhatsApp</text>

  <!-- feature pills -->
  <rect x="85" y="365" width="55" height="34" rx="8" fill="rgba(232,168,50,0.1)" stroke="#e8a832" stroke-width="1" opacity="0.5"/>
  <text x="112" y="388" font-family="Liberation Sans, Arial, sans-serif" font-weight="500" font-size="17" fill="#a09d95" text-anchor="middle">IA</text>

  <rect x="155" y="365" width="110" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="210" y="388" font-family="Liberation Sans, Arial, sans-serif" font-weight="500" font-size="17" fill="#6b6860" text-anchor="middle">Analytics</text>

  <rect x="280" y="365" width="100" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="330" y="388" font-family="Liberation Sans, Arial, sans-serif" font-weight="500" font-size="17" fill="#6b6860" text-anchor="middle">Futebol</text>

  <rect x="395" y="365" width="100" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="445" y="388" font-family="Liberation Sans, Arial, sans-serif" font-weight="500" font-size="17" fill="#6b6860" text-anchor="middle">Ranking</text>

  <rect x="510" y="365" width="120" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="570" y="388" font-family="Liberation Sans, Arial, sans-serif" font-weight="500" font-size="17" fill="#6b6860" text-anchor="middle">Dashboard</text>

  <!-- footer -->
  <text x="85" y="565" font-family="Liberation Sans, Arial, sans-serif" font-weight="400" font-size="18" fill="#5a574f">wabot.okivia.net</text>
  <text x="85" y="590" font-family="Liberation Sans, Arial, sans-serif" font-weight="400" font-size="14" fill="#3a3830">Chapa Soft Brand, powered by Okivia Group</text>

  <!-- decorative chart bars on right -->
  <rect x="750" y="340" width="50" height="190" rx="8" fill="#3d6b4f" opacity="0.7"/>
  <rect x="820" y="270" width="50" height="260" rx="8" fill="#8ebb30" opacity="0.7"/>
  <rect x="890" y="200" width="50" height="330" rx="8" fill="#e87a20" opacity="0.7"/>
  <rect x="960" y="140" width="50" height="390" rx="8" fill="#d43a3a" opacity="0.7"/>
  <rect x="1030" y="230" width="50" height="300" rx="8" fill="#e8a832" opacity="0.7"/>

  <!-- line connecting tops -->
  <polyline points="775,340 845,270 915,200 985,140 1055,230" fill="none" stroke="#e8a832" stroke-width="3" opacity="0.5" stroke-linejoin="round"/>
  <circle cx="775" cy="340" r="6" fill="#e8a832" opacity="0.7"/>
  <circle cx="845" cy="270" r="6" fill="#e8a832" opacity="0.7"/>
  <circle cx="915" cy="200" r="6" fill="#e8a832" opacity="0.7"/>
  <circle cx="985" cy="140" r="6" fill="#e8a832" opacity="0.7"/>
  <circle cx="1055" cy="230" r="6" fill="#e8a832" opacity="0.7"/>
</svg>
