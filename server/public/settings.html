<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/icon-180.png">
  <title>WABot — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="ranking.css">
  <style>
    :root {
      --green: #4ade80;
      --green-soft: rgba(74,222,128,0.12);
      --red: #ef4444;
      --red-soft: rgba(239,68,68,0.12);
    }

    .container {
      max-width: 700px;
    }

    .bg-glow--1 {
      top: -150px; left: -80px;
      background: #4a2d7a;
      opacity: 0.1;
    }
    .bg-glow--2 {
      bottom: -100px; right: -120px;
      background: var(--accent);
      opacity: 0.06;
    }

    /* --- header --- */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-bottom: 18px; padding: 6px 12px; border-radius: 6px;
      font-size: 0.75rem; font-weight: 500; color: var(--text-muted);
      text-decoration: none; border: 1px solid var(--border); transition: all 0.2s;
    }
    .back-link:hover { border-color: rgba(232,168,50,0.2); color: var(--accent); }
    .back-link svg { width: 14px; height: 14px; }

    .page-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* --- group card --- */
    .group-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .group-header:hover {
      background: var(--surface-raised);
    }

    .group-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .group-avatar.listening {
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.15);
    }

    .group-avatar.muted {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .group-info {
      flex: 1;
      min-width: 0;
    }

    .group-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-badges {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .badge {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .badge-listening {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge-troll {
      background: var(--red-soft);
      color: var(--red);
    }

    .badge-disabled {
      background: var(--surface);
      color: var(--text-muted);
    }

    .badge-milestones {
      background: var(--surface);
      color: var(--text);
    }

    .badge-tz {
      background: var(--surface);
      color: var(--text-secondary);
    }

    .tz-select {
      font-family: var(--font-body); font-size: 0.85rem;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; cursor: pointer; max-width: 220px;
      /* sem isto o browser desenha a lista aberta com o tema claro */
      color-scheme: dark;
    }
    .tz-select option { background: #14151a; color: var(--text); }

    .tz-select:focus { outline: none; border-color: var(--border-accent); }

    .membros-list { display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto; }
    .membro-row {
      display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
    }
    .membro-row:nth-child(odd) { background: rgba(255,255,255,0.02); }
    .membro-row.omitido .membro-nome { color: var(--text-muted); text-decoration: line-through; }
    .membro-nome { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .membro-total { font-size: 0.72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .group-expand {
      color: var(--text-muted);
      font-size: 1.2rem;
      transition: transform 0.3s ease, color 0.2s;
      flex-shrink: 0;
    }

    .group-card.open .group-expand {
      transform: rotate(90deg);
      color: var(--accent);
    }

    /* --- group detail --- */
    .group-detail {
      display: none;
      border-top: 1px solid var(--border);
      padding: 18px 20px;
    }

    .group-card.open .group-detail {
      display: block;
    }

    /* --- metrics panel --- */
    .metrics-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.12s forwards;
    }

    .metrics-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .metric-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .metric-value {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .metric-value .metric-unit {
      font-weight: 600;
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .metric-card.ok .metric-value { color: var(--green); }
    .metric-card.warn .metric-value { color: var(--accent); }
    .metric-card.bad .metric-value { color: var(--red); }
    .metric-card.neutral .metric-value { color: var(--text); }

    .qr-box {
      display: none; margin-top: 16px; padding: 16px;
      background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 12px; text-align: center;
    }
    .qr-box.show { display: block; }
    .qr-box img { width: 260px; max-width: 100%; border-radius: 10px; background: #fff; padding: 8px; }
    .qr-box p { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px; }
    .qr-box small { display: block; font-size: 0.72rem; color: var(--text-muted); margin-top: 10px; }

    .metrics-offline {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
    }

    /* --- toast --- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 10px;
      z-index: 10000;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      backdrop-filter: blur(12px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* --- search --- */
    .search-bar { margin-bottom: 16px; }
    .search-input {
      width: 100%;
      font-family: var(--font-body); font-size: 0.88rem;
      padding: 10px 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--border-accent); }
    .search-input::placeholder { color: var(--text-muted); }

    /* --- pagination --- */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 8px; margin-top: 20px; padding-bottom: 20px;
    }
    .page-btn {
      font-family: var(--font-body); font-size: 0.78rem; font-weight: 500;
      padding: 6px 12px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
    }
    .page-btn:hover { border-color: var(--border-accent); color: var(--text); }
    .page-btn.active { background: var(--accent-soft); border-color: var(--border-accent); color: var(--accent); font-weight: 600; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-info { font-size: 0.75rem; color: var(--text-muted); }

    /* --- premium users --- */
    .premium-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 6px; font-size: 0.78rem;
      background: var(--surface); border: 1px solid var(--border);
      margin: 2px 4px 2px 0;
    }
    .premium-chip.global { border-color: var(--border-accent); color: var(--accent); }
    .premium-chip button {
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      font-size: 0.9rem; padding: 0 2px; transition: color 0.2s;
    }
    .premium-chip button:hover { color: #ef4444; }

    .autocomplete-list {
      position: absolute; left: 0; right: 0; bottom: 100%;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      max-height: 180px; overflow-y: auto; z-index: 1000; display: none;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.4);
    }
    .autocomplete-list.open { display: block; }
    .ac-item {
      padding: 8px 12px; cursor: pointer; font-size: 0.82rem;
      display: flex; justify-content: space-between; align-items: center;
      transition: background 0.15s;
    }
    .ac-item:hover { background: var(--surface); }
    .ac-item-name { color: var(--text); }
    .ac-item-jid { color: var(--text-muted); font-size: 0.7rem; }

    @media (max-width: 480px) {
      .group-header { padding: 14px 16px; }
      .group-detail { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <div class="container">

    <div class="page-header">
      <a class="back-link" id="backToGroups" href="/admin/groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>Groups</a>
      <h1 class="page-title">Settings</h1>
      <p class="page-subtitle">Configurar grupos, comandos e troll mode</p>
    </div>

    <div class="metrics-panel" id="metrics">
      <div class="metrics-title">Bot Status</div>
      <div class="metrics-offline">A carregar...</div>
    </div>
    <div class="qr-box" id="qrBox">
      <p><b>Sessão do WhatsApp expirada.</b><br>
      Abre o WhatsApp no telemóvel → Aparelhos ligados → Ligar aparelho, e lê este código.</p>
      <img id="qrImg" alt="QR Code">
      <small id="qrIdade"></small>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Pesquisar grupo..." class="search-input">
    </div>

    <div class="group-list" id="list">
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="shared.js"></script>
  <script>
    const singleGroupMode = !!groupId

    let allCommands = []
    let allGroups = []
    let openCardId = null
    let searchQuery = ''
    let currentPage = 1
    const PAGE_SIZE = 10

    if (singleGroupMode) {
      document.getElementById('searchInput')?.parentElement?.remove()
      document.getElementById('metrics')?.remove()
      // dentro de um grupo a barra de baixo já tem o "Grupos"
      document.getElementById('backToGroups')?.remove()
      const header = document.querySelector('.page-header')
      if (header) {
        header.querySelector('.page-title').textContent = 'Definições do grupo'
        header.querySelector('.page-subtitle').textContent = ''
      }
    }

    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim()
      currentPage = 1
      renderGroups()
    })

    // --- metrics ---
    function formatUptime(secs) {
      const d = Math.floor(secs / 86400)
      const h = Math.floor((secs % 86400) / 3600)
      const m = Math.floor((secs % 3600) / 60)
      if (d > 0) return `${d}d ${h}h`
      if (h > 0) return `${h}h ${m}m`
      return `${m}m`
    }

    function lagLevel(ms) { return ms < 50 ? 'ok' : ms < 200 ? 'warn' : 'bad' }

    // O processo pode estar vivo e a sessão do WhatsApp morta — foi o que
    // aconteceu no logout: métricas verdes, bot surdo. Este cartão é o aviso.
    function estadoWa(wa) {
      if (!wa) return { classe: 'neutral', valor: '—', rotulo: 'WhatsApp' }
      if (wa.loggedOut) return { classe: 'bad', valor: 'QR', rotulo: 'Sessão expirada — ler QR' }
      if (wa.connection === 'open') return { classe: 'ok', valor: 'ligado', rotulo: 'WhatsApp' }
      return { classe: 'warn', valor: wa.connection || '?', rotulo: `WhatsApp${wa.statusCode ? ' — ' + wa.statusCode : ''}` }
    }
    function heapLevel(used, total) {
      const pct = parseFloat(used) / parseFloat(total)
      return pct < 0.7 ? 'ok' : pct < 0.9 ? 'warn' : 'bad'
    }

    // O QR muda a cada ~20s enquanto ninguém o lê, por isso é relido a cada
    // passagem das métricas em vez de ser guardado.
    async function loadQr(precisa) {
      const box = document.getElementById('qrBox')
      if (!box) return
      if (!precisa) { box.classList.remove('show'); return }
      try {
        const r = await fetch('/api/config/qr', { cache: 'no-store' })
        const d = await r.json()
        if (!d?.qr) { box.classList.remove('show'); return }
        document.getElementById('qrImg').src = d.qr
        const seg = Math.round((Date.now() - new Date(d.updated_at)) / 1000)
        document.getElementById('qrIdade').textContent =
          seg < 60 ? `gerado há ${seg}s` : `gerado há ${Math.round(seg / 60)} min — pode já ter expirado`
        box.classList.add('show')
      } catch (err) {
        box.classList.remove('show')
      }
    }

    async function loadMetrics() {
      const panel = document.getElementById('metrics')
      try {
        const res = await fetch('/api/config/metrics')
        const m = await res.json()
        if (!m) {
          panel.innerHTML = `<div class="metrics-title">Bot Status</div><div class="metrics-offline">Bot offline — sem dados</div>`
          return
        }
        loadQr(!!m.wa?.loggedOut)
        panel.innerHTML = `
          <div class="metrics-title">Bot Status</div>
          <div class="metrics-grid">
            <div class="metric-card ${estadoWa(m.wa).classe}">
              <div class="metric-value">${estadoWa(m.wa).valor}</div>
              <div class="metric-label">${estadoWa(m.wa).rotulo}</div>
            </div>
            <div class="metric-card ${lagLevel(parseFloat(m.eventLoopLag))}">
              <div class="metric-value">${m.eventLoopLag}<span class="metric-unit">ms</span></div>
              <div class="metric-label">Event Loop Lag</div>
            </div>
            <div class="metric-card ${heapLevel(m.heapUsed, m.heapTotal)}">
              <div class="metric-value">${m.heapUsed}<span class="metric-unit">MB</span></div>
              <div class="metric-label">Heap Used</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${m.heapTotal}<span class="metric-unit">MB</span></div>
              <div class="metric-label">Heap Total</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${m.rss}<span class="metric-unit">MB</span></div>
              <div class="metric-label">RSS Memory</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${m.external}<span class="metric-unit">MB</span></div>
              <div class="metric-label">External</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${formatUptime(parseInt(m.uptime))}</div>
              <div class="metric-label">Uptime</div>
            </div>
          </div>
        `
      } catch (e) {
        panel.innerHTML = `<div class="metrics-title">Bot Status</div><div class="metrics-offline">Erro ao carregar métricas</div>`
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.classList.add('show')
      clearTimeout(el._t)
      el._t = setTimeout(() => el.classList.remove('show'), 2000)
    }

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } }
      if (body) opts.body = JSON.stringify(body)
      const res = await fetch(path, opts)
      return res.json()
    }

    function toggleCard(id) {
      openCardId = openCardId === id ? null : id
      document.querySelectorAll('.group-card').forEach(card => {
        card.classList.toggle('open', card.dataset.id === openCardId)
      })
      if (openCardId === '__global__') loadGlobalPremiumUsers()
      else if (openCardId) { loadPremiumUsers(openCardId); loadMembros(openCardId) }
    }

    async function toggleListening(groupId, checked) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/listening`, { enabled: checked })
      showToast(checked ? 'Grupo ativado' : 'Grupo desativado')
      load()
    }

    async function toggleTroll(groupId, checked) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/troll`, { enabled: checked })
      showToast(checked ? 'Troll mode ativado' : 'Troll mode desativado')
      load()
    }

    const TIMEZONES = [
      ['Europe/Lisbon', 'Lisboa (Portugal)'],
      ['America/Recife', 'Recife (Pernambuco)'],
      ['America/Sao_Paulo', 'São Paulo / Brasília'],
      ['America/Fortaleza', 'Fortaleza (Ceará)'],
      ['America/Manaus', 'Manaus (Amazonas)'],
      ['Europe/Madrid', 'Madrid'],
      ['Europe/London', 'Londres'],
      ['America/New_York', 'Nova Iorque'],
      ['UTC', 'UTC'],
    ]

    async function updateTimezone(groupId, timezone) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/timezone`, { timezone })
      showToast(`Fuso alterado para ${timezone}`)
      load()
    }

    async function toggleMilestones(groupId, checked) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/milestones`, { enabled: checked })
      showToast(checked ? 'Milestones ativados' : 'Milestones desativados')
      load()
    }

    async function toggleGlobalCommand(cmd, enabledChecked) {
      await api('PUT', `/api/config/global/commands/${encodeURIComponent(cmd)}`, { disabled: !enabledChecked })
      showToast(enabledChecked ? `${cmd} ativado globalmente` : `${cmd} desativado globalmente`)
      load()
    }

    async function toggleCommand(groupId, cmd, enabledChecked) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/commands/${encodeURIComponent(cmd)}`, { disabled: !enabledChecked })
      showToast(enabledChecked ? `${cmd} ativado` : `${cmd} desativado`)
    }

    function updateTranscriptLimit(groupId, value) {
      debounce(`limit:${groupId}`, async () => {
        const limit = parseInt(value)
        if (isNaN(limit) || limit < 0 || limit > 1000) return
        await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/transcript-limit`, { limit })
        showToast(`Limite de transcrições: ${limit}/dia`)
      })
    }

    function updateTranscriptMaxSeconds(groupId, value) {
      debounce(`maxSec:${groupId}`, async () => {
        const seconds = parseInt(value)
        if (isNaN(seconds) || seconds < 1 || seconds > 3600) return
        await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/transcript-max-seconds`, { seconds })
        showToast(`Duração máxima: ${seconds}s`)
      })
    }

    let allContacts = null

    async function loadContacts() {
      if (allContacts) return allContacts
      allContacts = await api('GET', '/api/config/contacts')
      return allContacts
    }

    async function loadMembros(groupId) {
      const alvo = document.getElementById(`membros-${groupId}`)
      if (!alvo) return
      try {
        const membros = await api('GET', `/api/config/groups/${encodeURIComponent(groupId)}/members`)
        if (!membros.length) { alvo.innerHTML = '<div class="toggle-desc">Ainda não há atividade neste grupo.</div>'; return }
        alvo.innerHTML = membros.map(m => `
          <div class="membro-row${m.omitted ? ' omitido' : ''}">
            <span class="membro-nome" title="${esc(m.name)}">${esc(m.name)}</span>
            <span class="membro-total">${m.total}</span>
            <label class="toggle">
              <input type="checkbox" ${m.omitted ? 'checked' : ''}
                onchange="toggleOmitido('${groupId}', '${m.sender}', this.checked)">
              <span class="toggle-track"></span>
            </label>
          </div>`).join('')
      } catch (err) {
        alvo.innerHTML = '<div class="toggle-desc">Erro ao carregar membros.</div>'
      }
    }

    async function toggleOmitido(groupId, sender, omitted) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/members/${encodeURIComponent(sender)}/omit`, { omitted })
      showToast(omitted ? 'Membro omitido da visualização' : 'Membro visível novamente')
      loadMembros(groupId)
    }

    async function loadPremiumUsers(groupId) {
      try {
        const data = await api('GET', `/api/config/groups/${encodeURIComponent(groupId)}/premium-users`)
        const el = document.getElementById(`premium-list-${groupId}`)
        if (!el) return

        const users = data
        const chips = users.map(u =>
          `<span class="premium-chip">${esc(u.name)} <button data-group="${groupId}" data-sender="${u.sender}" class="remove-premium">&times;</button></span>`
        )

        el.innerHTML = chips.length
          ? chips.join('')
          : '<span style="color:var(--text-muted);font-size:0.78rem">Nenhum usuário premium</span>'

        el.querySelectorAll('.remove-premium').forEach(btn => {
          btn.addEventListener('click', () => removePremiumUser(btn.dataset.group, btn.dataset.sender))
        })

        // setup autocomplete (exclude existing users)
        const existingSenders = users.map(u => u.sender)
        setupAutocomplete(groupId, existingSenders)
      } catch (err) {
        console.error('Failed to load premium users', err)
      }
    }

    async function setupAutocomplete(groupId, existingSenders, isGlobal = false) {
      const contacts = await loadContacts()
      const input = document.getElementById(`premium-input-${groupId}`)
      const list = document.getElementById(`premium-ac-${groupId}`)
      if (!input || !list) return

      const existingSet = new Set(existingSenders)

      input.addEventListener('input', () => {
        const q = input.value.toLowerCase().trim()
        if (q.length < 2) { list.classList.remove('open'); return }

        const matches = contacts
          .filter(c => !existingSet.has(c.jid) && c.name.toLowerCase().includes(q))
          .slice(0, 8)

        if (matches.length === 0) { list.classList.remove('open'); return }

        list.innerHTML = matches.map(c =>
          `<div class="ac-item" data-jid="${c.jid}">
            <span class="ac-item-name">${esc(c.name)}</span>
            <span class="ac-item-jid">${esc(c.jid)}</span>
          </div>`
        ).join('')
        list.classList.add('open')
      })

      input.addEventListener('blur', () => {
        setTimeout(() => list.classList.remove('open'), 200)
      })

      list.addEventListener('click', async (e) => {
        const item = e.target.closest('.ac-item')
        if (!item) return
        const sender = item.dataset.jid
        if (isGlobal) {
          await api('POST', '/api/config/global/premium-users', { sender })
          input.value = ''
          list.classList.remove('open')
          showToast('Utilizador premium global adicionado')
          loadGlobalPremiumUsers()
        } else {
          await api('POST', `/api/config/groups/${encodeURIComponent(groupId)}/premium-users`, { sender })
          input.value = ''
          list.classList.remove('open')
          showToast('Utilizador premium adicionado')
          loadPremiumUsers(groupId)
        }
      })
    }

    async function removePremiumUser(groupId, sender) {
      await api('DELETE', `/api/config/groups/${encodeURIComponent(groupId)}/premium-users/${encodeURIComponent(sender)}`)
      showToast('Utilizador premium removido')
      loadPremiumUsers(groupId)
    }

    async function loadGlobalPremiumUsers() {
      try {
        const users = await api('GET', '/api/config/global/premium-users')
        const el = document.getElementById('premium-list-global')
        if (!el) return

        el.innerHTML = users.length
          ? users.map(u =>
              `<span class="premium-chip">${esc(u.name)} <button data-sender="${u.sender}" class="remove-global-premium">&times;</button></span>`
            ).join('')
          : '<span style="color:var(--text-muted);font-size:0.78rem">Nenhum utilizador premium global</span>'

        el.querySelectorAll('.remove-global-premium').forEach(btn => {
          btn.addEventListener('click', () => removeGlobalPremiumUser(btn.dataset.sender))
        })

        setupAutocomplete('global', users.map(u => u.sender), true)
      } catch (err) {
        console.error('Failed to load global premium users', err)
      }
    }

    async function removeGlobalPremiumUser(sender) {
      await api('DELETE', `/api/config/global/premium-users/${encodeURIComponent(sender)}`)
      showToast('Utilizador premium global removido')
      loadGlobalPremiumUsers()
    }

    function renderGlobalCard(data) {
      const globalDisabled = new Set(data.global_disabled || [])
      return `
        <div class="group-card${openCardId === '__global__' ? ' open' : ''}" data-id="__global__" style="animation-delay:0.1s">
          <div class="group-header" onclick="toggleCard('__global__')">
            <div class="group-avatar listening">G</div>
            <div class="group-info">
              <div class="group-name">Global</div>
              <div class="group-badges">
                <span class="badge badge-listening">Aplica a todos</span>
                ${globalDisabled.size > 0 ? `<span class="badge badge-disabled">${globalDisabled.size} cmd off</span>` : ''}
              </div>
            </div>
            <span class="group-expand">&#9656;</span>
          </div>
          <div class="group-detail">
            <div class="setting-section">
              <div class="setting-section-title">Comandos — default para todos os grupos</div>
              <div class="cmd-grid">
                ${allCommands.map(cmd => {
                  const enabled = !globalDisabled.has(cmd.name)
                  return `
                    <div class="cmd-row">
                      <div>
                        <div class="cmd-name">${esc(cmd.name)}</div>
                        <div class="cmd-desc">${cmd.description}</div>
                      </div>
                      <label class="toggle cmd">
                        <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleGlobalCommand('${cmd.name}', this.checked)">
                        <span class="toggle-track"></span>
                      </label>
                    </div>`
                }).join('')}
              </div>
            </div>
            <div class="setting-section">
              <div class="setting-section-title">Utilizadores Premium — todos os grupos</div>
              <div class="toggle-desc" style="margin-bottom:8px">Estes utilizadores têm acesso premium em todos os grupos</div>
              <div class="premium-list" id="premium-list-global">A carregar...</div>
              <div style="position:relative;margin-top:8px">
                <input type="text" class="search-input" id="premium-input-global" placeholder="Pesquisar contacto..." autocomplete="off" style="padding:6px 10px;font-size:0.8rem">
                <div class="autocomplete-list" id="premium-ac-global"></div>
              </div>
            </div>
          </div>
        </div>`
    }

    let cachedData = null

    async function load() {
      cachedData = await api('GET', '/api/config/groups')
      allCommands = cachedData.commands
      allGroups = cachedData.groups

      if (singleGroupMode) {
        allGroups = allGroups.filter(g => g.uuid === groupId)
        if (allGroups.length > 0) {
          openCardId = allGroups[0].id
          setTimeout(() => { loadPremiumUsers(openCardId); loadMembros(openCardId) }, 100)
        }
      }

      if (allGroups.length === 0 && allCommands.length === 0) {
        document.getElementById('list').innerHTML = '<div class="empty">Nenhum grupo encontrado. O bot precisa de estar conectado ao WhatsApp para sincronizar os grupos.</div>'
        return
      }

      renderGroups()
    }

    function renderGroups() {
      const container = document.getElementById('list')
      const filtered = searchQuery
        ? allGroups.filter(g => g.name.toLowerCase().includes(searchQuery))
        : allGroups

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE))
      if (currentPage > totalPages) currentPage = totalPages
      const start = (currentPage - 1) * PAGE_SIZE
      const page = filtered.slice(start, start + PAGE_SIZE)

      const globalHtml = !searchQuery ? renderGlobalCard(cachedData) : ''

      container.innerHTML = globalHtml + (page.length === 0
        ? '<div class="empty">Nenhum grupo encontrado</div>'
        : page.map((g, i) => renderGroupCard(g, i)).join(''))

      renderPagination(filtered.length, totalPages)
    }

    function renderGroupCard(g, i) {
      const disabledSet = new Set(g.disabled_commands)
      const avatarClass = g.listening ? 'listening' : 'muted'
      const initial = (g.name || '?')[0].toUpperCase()

      let badges = ''
      if (g.listening) badges += '<span class="badge badge-listening">Ativo</span>'
      if (g.troll_mode) badges += '<span class="badge badge-troll">Troll</span>'
      if (g.milestones) badges += '<span class="badge badge-milestones">🏆 Milestones</span>'
      if (g.timezone && g.timezone !== 'Europe/Lisbon') badges += `<span class="badge badge-tz">${esc(g.timezone)}</span>`
      if (g.disabled_commands.length > 0) badges += `<span class="badge badge-disabled">${g.disabled_commands.length} cmd off</span>`

      return `
        <div class="group-card${openCardId === g.id ? ' open' : ''}" data-id="${g.id}">
          <div class="group-header" onclick="toggleCard('${g.id}')">
            <div class="group-avatar ${avatarClass}">${initial}</div>
            <div class="group-info">
              <div class="group-name">${esc(g.name)}</div>
              <div class="group-badges">${badges || '<span class="badge badge-disabled">Inativo</span>'}</div>
            </div>
            <span class="group-expand">&#9656;</span>
          </div>
          <div class="group-detail">
            <div class="setting-section">
              <div class="setting-section-title">Geral</div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Escuta ativa</div>
                  <div class="toggle-desc">O bot processa mensagens e comandos deste grupo</div>
                </div>
                <label class="toggle">
                  <input type="checkbox" ${g.listening ? 'checked' : ''} onchange="toggleListening('${g.id}', this.checked)">
                  <span class="toggle-track"></span>
                </label>
              </div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Troll mode</div>
                  <div class="toggle-desc">Comandos devolvem respostas troll em vez de resultados reais</div>
                </div>
                <label class="toggle troll">
                  <input type="checkbox" ${g.troll_mode ? 'checked' : ''} onchange="toggleTroll('${g.id}', this.checked)">
                  <span class="toggle-track"></span>
                </label>
              </div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Milestones e prémios</div>
                  <div class="toggle-desc">Milestones de 100, 150 e 180 mensagens num dia (uma vez por pessoa) e, ao domingo, o prémio BISOU, HAT TRICK ou POKER de quem lidera os rankings (repetível)</div>
                </div>
                <label class="toggle">
                  <input type="checkbox" ${g.milestones ? 'checked' : ''} onchange="toggleMilestones('${g.id}', this.checked)">
                  <span class="toggle-track"></span>
                </label>
              </div>
              <!-- só visual: sem endpoint nem estado guardado -->
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Análise de Sentimento</div>
                  <div class="toggle-desc">Para ativar precisa autorização de todos os administradores do grupo</div>
                </div>
                <label class="toggle">
                  <input type="checkbox">
                  <span class="toggle-track"></span>
                </label>
              </div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Net Promoter Score (NPS)</div>
                  <div class="toggle-desc">Somente com business account</div>
                </div>
                <label class="toggle">
                  <input type="checkbox">
                  <span class="toggle-track"></span>
                </label>
              </div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Fuso horário</div>
                  <div class="toggle-desc">Em que fuso os dias são contados e apresentados — no ranking, no calendário e nos marcos</div>
                </div>
                <select class="tz-select" onchange="updateTimezone('${g.id}', this.value)">
                  ${TIMEZONES.concat(TIMEZONES.some(t => t[0] === g.timezone) ? [] : [[g.timezone, g.timezone]])
                    .map(([tz, rotulo]) => `<option value="${tz}"${tz === g.timezone ? ' selected' : ''}>${esc(rotulo)}</option>`)
                    .join('')}
                </select>
              </div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Limite de transcrições</div>
                  <div class="toggle-desc">Máximo de transcrições de áudio por utilizador/dia</div>
                </div>
                <input type="number" class="number-input" min="0" value="${g.transcript_daily_limit}"
                  onchange="updateTranscriptLimit('${g.id}', this.value)">
              </div>
              <div class="toggle-row">
                <div>
                  <div class="toggle-label">Duração máxima do áudio</div>
                  <div class="toggle-desc">Máximo de segundos por áudio para transcrição</div>
                </div>
                <input type="number" class="number-input" min="1" value="${g.transcript_max_seconds}"
                  onchange="updateTranscriptMaxSeconds('${g.id}', this.value)">
              </div>
            </div>
            <div class="setting-section">
              <div class="setting-section-title">Utilizadores Premium</div>
              <div class="premium-users" id="premium-${g.id}">
                <div class="toggle-desc" style="margin-bottom:8px">Utilizadores com acesso a funcionalidades premium (!resumo)</div>
                <div class="premium-list" id="premium-list-${g.id}">A carregar...</div>
                <div style="position:relative;margin-top:8px">
                  <input type="text" class="search-input" id="premium-input-${g.id}" placeholder="Pesquisar contacto..." autocomplete="off" style="padding:6px 10px;font-size:0.8rem">
                  <div class="autocomplete-list" id="premium-ac-${g.id}"></div>
                </div>
              </div>
            </div>
            <div class="setting-section">
              <div class="setting-section-title">Membros</div>
              <div class="toggle-desc" style="margin-bottom:10px">
                Omitir esconde a pessoa dos rankings, listas, gráficos, calendário e mensagens do bot.
                Os eventos continuam a ser guardados — é reversível a qualquer momento.
              </div>
              <div id="membros-${g.id}" class="membros-list">A carregar...</div>
            </div>
            <div class="setting-section">
              <div class="setting-section-title">Comandos</div>
              <div class="cmd-grid">
                ${allCommands.map(cmd => {
                  const enabled = !disabledSet.has(cmd.name)
                  return `
                    <div class="cmd-row">
                      <div>
                        <div class="cmd-name">${esc(cmd.name)}</div>
                        <div class="cmd-desc">${cmd.description}</div>
                      </div>
                      <label class="toggle cmd">
                        <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleCommand('${g.id}', '${cmd.name}', this.checked)">
                        <span class="toggle-track"></span>
                      </label>
                    </div>`
                }).join('')}
              </div>
            </div>
          </div>
        </div>`
    }

    function renderPagination(total, totalPages) {
      const container = document.getElementById('pagination')
      if (!container || singleGroupMode || totalPages <= 1) { if (container) container.innerHTML = ''; return }

      let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>&larr;</button>`
      for (let p = 1; p <= totalPages; p++) {
        html += `<button class="page-btn${p === currentPage ? ' active' : ''}" onclick="goPage(${p})">${p}</button>`
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>&rarr;</button>`
      html += `<span class="page-info">${total} grupo${total !== 1 ? 's' : ''}</span>`
      container.innerHTML = html
    }

    function goPage(p) {
      currentPage = p
      renderGroups()
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }

    load()
    loadMetrics()
    setInterval(loadMetrics, 5000)
  </script>
</body>
</html>
