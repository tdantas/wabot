<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WABot — Definições</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0b0f;
      --surface: rgba(255,255,255,0.035);
      --surface-raised: rgba(255,255,255,0.055);
      --border: rgba(255,255,255,0.06);
      --border-accent: rgba(232,168,50,0.2);
      --text: #e8e6e1;
      --text-secondary: #a09d95;
      --text-muted: #5a574f;
      --accent: #e8a832;
      --accent-soft: rgba(232,168,50,0.12);
      --green: #4ade80;
      --green-soft: rgba(74,222,128,0.12);
      --red: #ef4444;
      --red-soft: rgba(239,68,68,0.12);
      --font-display: 'Bricolage Grotesque', serif;
      --font-body: 'Outfit', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(150px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow--1 {
      width: 500px; height: 500px;
      top: -150px; left: -80px;
      background: #4a2d7a;
      opacity: 0.1;
    }
    .bg-glow--2 {
      width: 400px; height: 400px;
      bottom: -100px; right: -120px;
      background: var(--accent);
      opacity: 0.06;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* --- nav --- */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 16px; height: 16px; }

    /* --- header --- */
    .page-header {
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
    }

    .page-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* --- group card --- */
    .group-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .group-header:hover {
      background: var(--surface-raised);
    }

    .group-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .group-avatar.listening {
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid rgba(74,222,128,0.15);
    }

    .group-avatar.muted {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .group-info {
      flex: 1;
      min-width: 0;
    }

    .group-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-badges {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .badge {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .badge-listening {
      background: var(--green-soft);
      color: var(--green);
    }

    .badge-troll {
      background: var(--red-soft);
      color: var(--red);
    }

    .badge-disabled {
      background: var(--surface);
      color: var(--text-muted);
    }

    .group-expand {
      color: var(--text-muted);
      font-size: 1.2rem;
      transition: transform 0.3s ease, color 0.2s;
      flex-shrink: 0;
    }

    .group-card.open .group-expand {
      transform: rotate(90deg);
      color: var(--accent);
    }

    /* --- group detail --- */
    .group-detail {
      display: none;
      border-top: 1px solid var(--border);
      padding: 18px 20px;
    }

    .group-card.open .group-detail {
      display: block;
    }

    .setting-section {
      margin-bottom: 20px;
    }

    .setting-section:last-child {
      margin-bottom: 0;
    }

    .setting-section-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* --- toggle --- */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    .toggle-row + .toggle-row {
      border-top: 1px solid var(--border);
    }

    .toggle-label {
      font-size: 0.88rem;
      font-weight: 500;
    }

    .toggle-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.25s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: transform 0.25s, background 0.25s;
    }

    .toggle input:checked + .toggle-track {
      background: var(--green-soft);
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(20px);
      background: var(--green);
    }

    /* troll toggle uses red */
    .toggle.troll input:checked + .toggle-track {
      background: var(--red-soft);
    }

    .toggle.troll input:checked + .toggle-track::after {
      background: var(--red);
    }

    /* command disabled toggle uses accent */
    .toggle.cmd input:checked + .toggle-track {
      background: var(--accent-soft);
    }

    .toggle.cmd input:checked + .toggle-track::after {
      background: var(--accent);
    }

    /* --- commands grid --- */
    .cmd-grid {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cmd-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .cmd-row:nth-child(odd) {
      background: rgba(255,255,255,0.02);
    }

    .cmd-name {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .cmd-desc {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* --- metrics panel --- */
    .metrics-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.12s forwards;
    }

    .metrics-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .metric-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .metric-value {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .metric-value .metric-unit {
      font-weight: 600;
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .metric-card.ok .metric-value { color: var(--green); }
    .metric-card.warn .metric-value { color: var(--accent); }
    .metric-card.bad .metric-value { color: var(--red); }
    .metric-card.neutral .metric-value { color: var(--text); }

    .metrics-offline {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
    }

    /* --- empty / loading --- */
    .empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 60px 20px;
    }

    .loading {
      display: flex;
      justify-content: center;
      padding: 60px 0;
    }
    .loading-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 4px;
      animation: pulse 1.2s ease infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.15s; }
    .loading-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- toast --- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 10px;
      z-index: 10000;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      backdrop-filter: blur(12px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      .container { padding: 24px 16px 60px; }
      .group-header { padding: 14px 16px; }
      .group-detail { padding: 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <div class="container">
    <nav class="nav">
      <a class="back-link" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Grupos
      </a>
    </nav>

    <div class="page-header">
      <h1 class="page-title">Definições</h1>
      <p class="page-subtitle">Configurar grupos, comandos e troll mode</p>
    </div>

    <div class="metrics-panel" id="metrics">
      <div class="metrics-title">Bot Status</div>
      <div class="metrics-offline">A carregar...</div>
    </div>

    <div class="group-list" id="list">
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allCommands = []
    let openCardId = null

    // --- metrics ---
    function formatUptime(secs) {
      const d = Math.floor(secs / 86400)
      const h = Math.floor((secs % 86400) / 3600)
      const m = Math.floor((secs % 3600) / 60)
      if (d > 0) return `${d}d ${h}h`
      if (h > 0) return `${h}h ${m}m`
      return `${m}m`
    }

    function lagLevel(ms) { return ms < 50 ? 'ok' : ms < 200 ? 'warn' : 'bad' }
    function heapLevel(used, total) {
      const pct = parseFloat(used) / parseFloat(total)
      return pct < 0.7 ? 'ok' : pct < 0.9 ? 'warn' : 'bad'
    }

    async function loadMetrics() {
      const panel = document.getElementById('metrics')
      try {
        const res = await fetch('/api/config/metrics')
        const m = await res.json()
        if (!m) {
          panel.innerHTML = `<div class="metrics-title">Bot Status</div><div class="metrics-offline">Bot offline — sem dados</div>`
          return
        }
        panel.innerHTML = `
          <div class="metrics-title">Bot Status</div>
          <div class="metrics-grid">
            <div class="metric-card ${lagLevel(parseFloat(m.eventLoopLag))}">
              <div class="metric-value">${m.eventLoopLag}<span class="metric-unit">ms</span></div>
              <div class="metric-label">Event Loop Lag</div>
            </div>
            <div class="metric-card ${heapLevel(m.heapUsed, m.heapTotal)}">
              <div class="metric-value">${m.heapUsed}<span class="metric-unit">MB</span></div>
              <div class="metric-label">Heap Used</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${m.heapTotal}<span class="metric-unit">MB</span></div>
              <div class="metric-label">Heap Total</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${m.rss}<span class="metric-unit">MB</span></div>
              <div class="metric-label">RSS Memory</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${m.external}<span class="metric-unit">MB</span></div>
              <div class="metric-label">External</div>
            </div>
            <div class="metric-card neutral">
              <div class="metric-value">${formatUptime(parseInt(m.uptime))}</div>
              <div class="metric-label">Uptime</div>
            </div>
          </div>
        `
      } catch (e) {
        panel.innerHTML = `<div class="metrics-title">Bot Status</div><div class="metrics-offline">Erro ao carregar métricas</div>`
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.classList.add('show')
      clearTimeout(el._t)
      el._t = setTimeout(() => el.classList.remove('show'), 2000)
    }

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } }
      if (body) opts.body = JSON.stringify(body)
      const res = await fetch(path, opts)
      return res.json()
    }

    function toggleCard(id) {
      openCardId = openCardId === id ? null : id
      document.querySelectorAll('.group-card').forEach(card => {
        card.classList.toggle('open', card.dataset.id === openCardId)
      })
    }

    async function toggleListening(groupId, checked) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/listening`, { enabled: checked })
      showToast(checked ? 'Grupo ativado' : 'Grupo desativado')
      load()
    }

    async function toggleTroll(groupId, checked) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/troll`, { enabled: checked })
      showToast(checked ? 'Troll mode ativado' : 'Troll mode desativado')
      load()
    }

    async function toggleGlobalCommand(cmd, enabledChecked) {
      await api('PUT', `/api/config/global/commands/${encodeURIComponent(cmd)}`, { disabled: !enabledChecked })
      showToast(enabledChecked ? `${cmd} ativado globalmente` : `${cmd} desativado globalmente`)
      load()
    }

    async function toggleCommand(groupId, cmd, enabledChecked) {
      await api('PUT', `/api/config/groups/${encodeURIComponent(groupId)}/commands/${encodeURIComponent(cmd)}`, { disabled: !enabledChecked })
      showToast(enabledChecked ? `${cmd} ativado` : `${cmd} desativado`)
    }

    function renderGlobalCard(data) {
      const globalDisabled = new Set(data.global_disabled || [])
      return `
        <div class="group-card${openCardId === '__global__' ? ' open' : ''}" data-id="__global__" style="animation-delay:0.1s">
          <div class="group-header" onclick="toggleCard('__global__')">
            <div class="group-avatar listening">G</div>
            <div class="group-info">
              <div class="group-name">Global</div>
              <div class="group-badges">
                <span class="badge badge-listening">Aplica a todos</span>
                ${globalDisabled.size > 0 ? `<span class="badge badge-disabled">${globalDisabled.size} cmd off</span>` : ''}
              </div>
            </div>
            <span class="group-expand">&#9656;</span>
          </div>
          <div class="group-detail">
            <div class="setting-section">
              <div class="setting-section-title">Comandos — default para todos os grupos</div>
              <div class="cmd-grid">
                ${allCommands.map(cmd => {
                  const enabled = !globalDisabled.has(cmd.name)
                  return `
                    <div class="cmd-row">
                      <div>
                        <div class="cmd-name">${cmd.name}</div>
                        <div class="cmd-desc">${cmd.description}</div>
                      </div>
                      <label class="toggle cmd">
                        <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleGlobalCommand('${cmd.name}', this.checked)">
                        <span class="toggle-track"></span>
                      </label>
                    </div>`
                }).join('')}
              </div>
            </div>
          </div>
        </div>`
    }

    async function load() {
      const data = await api('GET', '/api/config/groups')
      allCommands = data.commands
      const container = document.getElementById('list')

      if (data.groups.length === 0 && allCommands.length === 0) {
        container.innerHTML = '<div class="empty">Nenhum grupo encontrado. O bot precisa de estar conectado ao WhatsApp para sincronizar os grupos.</div>'
        return
      }

      const globalHtml = renderGlobalCard(data)

      container.innerHTML = globalHtml + data.groups.map((g, i) => {
        const disabledSet = new Set(g.disabled_commands)
        const avatarClass = g.listening ? 'listening' : 'muted'
        const initial = (g.name || '?')[0].toUpperCase()

        let badges = ''
        if (g.listening) badges += '<span class="badge badge-listening">Ativo</span>'
        if (g.troll_mode) badges += '<span class="badge badge-troll">Troll</span>'
        if (g.disabled_commands.length > 0) badges += `<span class="badge badge-disabled">${g.disabled_commands.length} cmd off</span>`

        return `
          <div class="group-card${openCardId === g.id ? ' open' : ''}" data-id="${g.id}" style="animation-delay:${0.15 + i * 0.05}s">
            <div class="group-header" onclick="toggleCard('${g.id}')">
              <div class="group-avatar ${avatarClass}">${initial}</div>
              <div class="group-info">
                <div class="group-name">${g.name}</div>
                <div class="group-badges">${badges || '<span class="badge badge-disabled">Inativo</span>'}</div>
              </div>
              <span class="group-expand">&#9656;</span>
            </div>
            <div class="group-detail">
              <div class="setting-section">
                <div class="setting-section-title">Geral</div>
                <div class="toggle-row">
                  <div>
                    <div class="toggle-label">Escuta ativa</div>
                    <div class="toggle-desc">O bot processa mensagens e comandos deste grupo</div>
                  </div>
                  <label class="toggle">
                    <input type="checkbox" ${g.listening ? 'checked' : ''} onchange="toggleListening('${g.id}', this.checked)">
                    <span class="toggle-track"></span>
                  </label>
                </div>
                <div class="toggle-row">
                  <div>
                    <div class="toggle-label">Troll mode</div>
                    <div class="toggle-desc">Comandos devolvem respostas troll em vez de resultados reais</div>
                  </div>
                  <label class="toggle troll">
                    <input type="checkbox" ${g.troll_mode ? 'checked' : ''} onchange="toggleTroll('${g.id}', this.checked)">
                    <span class="toggle-track"></span>
                  </label>
                </div>
              </div>
              <div class="setting-section">
                <div class="setting-section-title">Comandos</div>
                <div class="cmd-grid">
                  ${allCommands.map(cmd => {
                    const enabled = !disabledSet.has(cmd.name)
                    return `
                      <div class="cmd-row">
                        <div>
                          <div class="cmd-name">${cmd.name}</div>
                          <div class="cmd-desc">${cmd.description}</div>
                        </div>
                        <label class="toggle cmd">
                          <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleCommand('${g.id}', '${cmd.name}', this.checked)">
                          <span class="toggle-track"></span>
                        </label>
                      </div>`
                  }).join('')}
                </div>
              </div>
            </div>
          </div>`
      }).join('')
    }

    load()
    loadMetrics()
    setInterval(loadMetrics, 5000)
  </script>
</body>
</html>
