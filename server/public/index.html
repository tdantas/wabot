<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WABot — Grupos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0b0f;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.06);
      --text: #e8e6e1;
      --text-muted: #6b6860;
      --accent: #e8a832;
      --accent-glow: rgba(232,168,50,0.15);
      --font-display: 'Bricolage Grotesque', serif;
      --font-body: 'Outfit', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- noise grain overlay --- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* --- ambient background glow --- */
    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow--1 {
      top: -200px;
      right: -100px;
      background: var(--accent);
    }
    .bg-glow--2 {
      bottom: -200px;
      left: -150px;
      background: #5b3a8c;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* --- header --- */
    .header {
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .settings-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .settings-link:hover {
      border-color: rgba(232,168,50,0.2);
      color: var(--accent);
    }
    .settings-link svg { width: 14px; height: 14px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), #d4922a);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--bg);
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -1.5px;
      line-height: 1;
    }

    .brand h1 span {
      color: var(--accent);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.3px;
      margin-top: 6px;
      padding-left: 58px;
    }

    /* --- group cards --- */
    .groups {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s ease;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .group-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-glow), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .group-card:hover {
      border-color: rgba(232,168,50,0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .group-card:hover::before {
      opacity: 1;
    }

    .group-card:active {
      transform: translateY(0);
    }

    .group-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(232,168,50,0.2), rgba(232,168,50,0.05));
      border: 1px solid rgba(232,168,50,0.15);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .group-avatar svg {
      width: 22px;
      height: 22px;
      color: var(--accent);
    }

    .group-info {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .group-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.3px;
      word-break: break-word;
    }

    .group-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.3px;
    }

    .group-arrow {
      color: var(--text-muted);
      font-size: 1.4rem;
      transition: transform 0.25s ease, color 0.25s ease;
      position: relative;
      z-index: 1;
    }

    .group-card:hover .group-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* --- empty state --- */
    .empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 60px 20px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.2s forwards;
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* --- loading --- */
    .loading {
      display: flex;
      justify-content: center;
      padding: 60px 0;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 4px;
      animation: pulse 1.2s ease infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.15s; }
    .loading-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-mark">W</div>
          <h1>WA<span>Bot</span></h1>
        </div>
        <a class="settings-link" href="/settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Definições
        </a>
      </div>
      <div class="subtitle">Atividade dos grupos em tempo real</div>
    </div>

    <div class="groups" id="groups">
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
  </div>

  <script>
    async function load() {
      const res = await fetch('/api/groups')
      const groups = await res.json()
      const container = document.getElementById('groups')

      if (groups.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">&#9898;</div>
            Nenhum grupo configurado
          </div>`
        return
      }

      container.innerHTML = groups.map((g, i) => `
        <a class="group-card" href="/group.html?id=${encodeURIComponent(g.id)}" style="animation-delay: ${0.1 + i * 0.08}s">
          <div class="group-avatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="group-info">
            <div class="group-name">${g.name}</div>
            <div class="group-label">Grupo WhatsApp</div>
          </div>
          <span class="group-arrow">&rsaquo;</span>
        </a>
      `).join('')
    }

    load()
  </script>
</body>
</html>
