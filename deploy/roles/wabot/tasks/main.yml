---
# ── Config files ────────────────────────────────────────
- name: Copy .env
  template:
    src: env.j2
    dest: "{{ wabot_config_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  notify: restart wabot
  tags: [bot, server]

- name: Copy config.json (if not exists)
  template:
    src: config.json.j2
    dest: "{{ wabot_config_dir }}/config.json"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
    force: false
  tags: [bot]

- name: Copy docker-compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ wabot_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: restart wabot
  tags: [bot, server]

# ── Caddy snippet ───────────────────────────────────────
- name: Add WABot Caddy config
  template:
    src: caddy-wabot.j2
    dest: "{{ caddy_config_dir }}/conf.d/wabot.caddy"
    owner: root
    group: root
    mode: "0644"
  notify: reload caddy
  tags: [server]

# ── Prompts ─────────────────────────────────────────────
- name: Sync prompts directory
  synchronize:
    src: "{{ playbook_dir }}/../bot/prompts/"
    dest: "{{ wabot_config_dir }}/prompts/"
    delete: true
  notify: restart wabot
  tags: [bot]

# ── Build bot image ─────────────────────────────────────
- name: Copy bot source for build
  synchronize:
    src: "{{ playbook_dir }}/../bot/"
    dest: "{{ wabot_dir }}/build/bot/"
    delete: true
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=auth_info"
      - "--exclude=.env"
      - "--exclude=*.db"
      - "--exclude=*.db-wal"
      - "--exclude=*.db-shm"
  tags: [bot]

- name: Copy Dockerfile for bot
  template:
    src: Dockerfile.bot.j2
    dest: "{{ wabot_dir }}/build/Dockerfile.bot"
  tags: [bot]

- name: Build bot image
  community.docker.docker_image:
    name: wabot-bot
    tag: latest
    source: build
    build:
      path: "{{ wabot_dir }}/build"
      dockerfile: Dockerfile.bot
    force_source: true
  tags: [bot]

# ── Build server image ──────────────────────────────────
- name: Copy server source for build
  synchronize:
    src: "{{ playbook_dir }}/../server/"
    dest: "{{ wabot_dir }}/build/server/"
    delete: true
    rsync_opts:
      - "--exclude=node_modules"
  tags: [server]

- name: Copy Dockerfile for server
  template:
    src: Dockerfile.server.j2
    dest: "{{ wabot_dir }}/build/Dockerfile.server"
  tags: [server]

- name: Build server image
  community.docker.docker_image:
    name: wabot-server
    tag: latest
    source: build
    build:
      path: "{{ wabot_dir }}/build"
      dockerfile: Dockerfile.server
    force_source: true
  tags: [server]

# ── Always trigger restart to pick up new images ────────
- name: Trigger WABot restart
  command: /bin/true
  notify: restart wabot
  changed_when: true
  tags: [bot, server]
