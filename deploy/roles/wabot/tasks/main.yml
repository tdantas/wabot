---
# ── 1. Dependencies (skip if already present) ────────────
- name: Install Docker prerequisites
  apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
  tags: [bot, server]

- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false
  tags: [bot, server]

- name: Install Docker (if not present)
  when: docker_check.rc != 0
  tags: [bot, server]
  block:
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

# ── 2. Directory structure ────────────────────────────────
- name: Create WABot directories
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ wabot_dir }}"
    - "{{ wabot_dir }}/build"
    - "{{ wabot_config_dir }}"
    - "{{ wabot_data_dir }}"
    - "{{ wabot_data_dir }}/auth_info"
  tags: [bot, server]

# ── 3. Config files ──────────────────────────────────────
- name: Copy .env
  template:
    src: env.j2
    dest: "{{ wabot_config_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  notify: restart wabot
  tags: [bot, server]

- name: Copy config.json (if not exists)
  template:
    src: config.json.j2
    dest: "{{ wabot_config_dir }}/config.json"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
    force: false
  tags: [bot]

- name: Copy docker-compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ wabot_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: restart wabot
  tags: [bot, server]

# ── 4. Seed database (only if not exists) ────────────────
- name: Check if database exists on server
  stat:
    path: "{{ wabot_data_dir }}/wabot.db"
  register: db_file
  tags: [bot]

- name: Copy local database to server
  copy:
    src: "{{ playbook_dir }}/../bot/wabot.db"
    dest: "{{ wabot_data_dir }}/wabot.db"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  when: not db_file.stat.exists
  tags: [bot]

# ── 5. Seed auth_info (only if empty) ───────────────────
- name: Check if auth_info exists on server
  find:
    paths: "{{ wabot_data_dir }}/auth_info"
    file_type: file
  register: auth_files
  tags: [bot]

- name: Copy local auth_info to server
  synchronize:
    src: "{{ playbook_dir }}/../bot/auth_info/"
    dest: "{{ wabot_data_dir }}/auth_info/"
  when: auth_files.matched == 0
  tags: [bot]

# ── 6. Prompts ───────────────────────────────────────────
- name: Sync prompts directory
  synchronize:
    src: "{{ playbook_dir }}/../bot/prompts/"
    dest: "{{ wabot_config_dir }}/prompts/"
    delete: true
  notify: restart wabot
  tags: [bot]

# ── 7. Build bot image ──────────────────────────────────
- name: Copy bot source for build
  synchronize:
    src: "{{ playbook_dir }}/../bot/"
    dest: "{{ wabot_dir }}/build/bot/"
    delete: true
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=auth_info"
      - "--exclude=.env"
      - "--exclude=*.db"
      - "--exclude=*.db-wal"
      - "--exclude=*.db-shm"
  tags: [bot]

- name: Copy Dockerfile for bot
  template:
    src: Dockerfile.bot.j2
    dest: "{{ wabot_dir }}/build/Dockerfile.bot"
  tags: [bot]

- name: Build bot image
  community.docker.docker_image:
    name: wabot-bot
    tag: latest
    source: build
    build:
      path: "{{ wabot_dir }}/build"
      dockerfile: Dockerfile.bot
    force_source: true
  tags: [bot]

# ── 8. Build server image ───────────────────────────────
- name: Copy server source for build
  synchronize:
    src: "{{ playbook_dir }}/../server/"
    dest: "{{ wabot_dir }}/build/server/"
    delete: true
    rsync_opts:
      - "--exclude=node_modules"
  tags: [server]

- name: Copy Dockerfile for server
  template:
    src: Dockerfile.server.j2
    dest: "{{ wabot_dir }}/build/Dockerfile.server"
  tags: [server]

- name: Build server image
  community.docker.docker_image:
    name: wabot-server
    tag: latest
    source: build
    build:
      path: "{{ wabot_dir }}/build"
      dockerfile: Dockerfile.server
    force_source: true
  tags: [server]

# ── 9. Caddy config (don't touch existing) ──────────────
- name: Create conf.d directory
  file:
    path: "{{ caddy_config_dir }}/conf.d"
    state: directory
    mode: "0755"
  tags: [server]

- name: Add WABot Caddy config
  template:
    src: caddy-wabot.j2
    dest: "{{ caddy_config_dir }}/conf.d/wabot.caddy"
    owner: root
    group: root
    mode: "0644"
  notify: reload caddy
  tags: [server]

- name: Ensure Caddy imports conf.d
  lineinfile:
    path: "{{ caddy_config_dir }}/Caddyfile"
    line: "import /etc/caddy/conf.d/*.caddy"
    state: present
  notify: reload caddy
  tags: [server]

# ── 10. Systemd service ─────────────────────────────────
- name: Install WABot systemd service
  template:
    src: wabot.service.j2
    dest: /etc/systemd/system/wabot.service
    mode: "0644"
  notify:
    - reload systemd
    - restart wabot
  tags: [bot, server]

- name: Enable WABot service
  systemd:
    name: wabot
    enabled: true
  tags: [bot, server]

# always restart to pick up new images
- name: Restart WABot service
  systemd:
    name: wabot
    state: restarted
  tags: [bot, server]
