services:
  bot:
    image: wabot-bot:latest
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Lisbon}
      - DB_PATH=/app/data/wabot.db
      - AUTH_DIR=/app/auth_info
    volumes:
      - wabot-auth:/app/auth_info
      - wabot-data:/app/data
      - ./bot/config.json:/app/config.json:ro
      - ./bot/prompts:/app/prompts:ro
    restart: unless-stopped

  server:
    image: wabot-server:latest
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Lisbon}
      - PORT=3000
      - DB_PATH=/app/data/wabot.db
    volumes:
      - wabot-data:/app/data:ro
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - bot

volumes:
  wabot-auth:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AUTH_PATH:-./data/auth_info}
  wabot-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}
