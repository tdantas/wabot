services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspaces/wabot:cached
      - ${HOME}/.claude:/home/node/.claude:cached
    command: sleep infinity
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://wabot:wabot@timescaledb:5432/wabot

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_USER=wabot
      - POSTGRES_PASSWORD=wabot
      - POSTGRES_DB=wabot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wabot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
